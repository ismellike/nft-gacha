[workspace]
members = ["packages/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.6.0-alpha.1"
license = "MIT"
authors = ["Lay3r Labs Team"]
repository = "https://github.com/Lay3rLabs/nft-gacha"
rust-version = "1.80.0"

[workspace.dependencies]
# WASI
wstd = "0.5.6"
wasi = "0.14.2"
wavs-wasi-utils = "2.6.0"
wit-bindgen = "0.46.0"
wasip2 = "1.0.1"

# Other
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
anyhow = "1.0.98"

## Alloy
alloy-sol-macro = { version = "1.4.1", features = ["json"] }
alloy-sol-types = "1.4.1"
alloy-primitives = { version = "1.4.1", features = ["serde"] }
alloy-network = "=1.0.42"
alloy-provider = { version = "=1.0.42", features = ["ws", "pubsub"] }
alloy-rpc-types = "=1.0.42"
alloy-contract = "=1.0.42"
alloy-transport-http = "=1.0.42"
