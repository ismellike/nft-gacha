[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read-write", path = "./" },
    { access = "read-write", path = "../" },
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@wavs=node_modules/.pnpm/@wavs+solidity@0.5.0-beta.5/node_modules/@wavs/solidity/contracts/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

# Suppress naming convention lints for standard Solidity acronyms (USD, NFT, URI)
[lint]
exclude_lints = [
    "mixed-case-variable",
    "mixed-case-function",
    "screaming-snake-case-immutable",
    "pascal-case-struct",
]

# Coverage configuration
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536
seed = "0x3e8"

[profile.default.invariant]
runs = 256
depth = 15
fail_on_revert = false

# Gas configuration

# Enhanced test configuration
[profile.test]
verbosity = 3
sender = "0x1804c8AB1F12E6bbf3894d4083f33e07309d1F38"
tx_origin = "0x1804c8AB1F12E6bbf3894d4083f33e07309d1F38"
initial_balance = "0xffffffffffffffffffffffff"

# Coverage profile for detailed analysis
[profile.coverage]
out = "coverage"
ffi = true
sender = "0x1804c8AB1F12E6bbf3894d4083f33e07309d1F38"
tx_origin = "0x1804c8AB1F12E6bbf3894d4083f33e07309d1F38"
initial_balance = "0xffffffffffffffffffffffff"
