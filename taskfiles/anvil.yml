version: '3'

includes:
  backend:
    taskfile: ./backend.yml

tasks:
  start:
    desc: Start WAVS backend services (alias for backend:start)
    cmds:
      - task: backend:start

  stop:
    desc: Stop WAVS backend services (alias for backend:stop)
    cmds:
      - task: backend:stop

  logs:
    desc: Show logs for the first Anvil chain
    cmds:
      - docker logs -f chain-anvil-1

  status:
    desc: Check status of WAVS services
    cmds:
      - |
        echo "🔍 WAVS System Status"
        echo "===================="
        
        # Check Anvil chains
        CHAIN_COUNT=$(docker ps --filter "name=chain-anvil-" --format '{{.Names}}' | wc -l)
        if [ "$CHAIN_COUNT" -gt 0 ]; then
          echo "✅ Anvil Chains: $CHAIN_COUNT running"
        else
          echo "❌ Anvil Chains: None running"
        fi
        
        # Check WAVS instances  
        WAVS_COUNT=$(docker ps --filter "name=wavs-" --format '{{.Names}}' | grep -v '^wavs-aggregator$' | wc -l)
        if [ "$WAVS_COUNT" -gt 0 ]; then
          echo "✅ WAVS Instances: $WAVS_COUNT running"
        else
          echo "❌ WAVS Instances: None running"
        fi
        
        # Check WAVS Aggregator
        if docker ps --filter "name=wavs-aggregator" --format '{{.Names}}' | grep -q wavs-aggregator; then
          echo "✅ WAVS Aggregator: Running"
        else
          echo "❌ WAVS Aggregator: Not running"
        fi