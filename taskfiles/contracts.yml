version: '3'

includes:
  backend:
    taskfile: ./backend.yml

vars:
  CONTRACTS_DIR: ./contracts
  # Use the first WAVS Anvil chain (port 8548)
  ANVIL_PORT: 8548

tasks:
  build:
    desc: Build smart contracts
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - forge build

  test:
    desc: Run smart contract tests
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - forge test

  deploy:
    desc: Deploy Gacha system contracts to WAVS chain using Forge script
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - |
        # Check if WAVS chain is running
        if ! nc -z localhost {{.ANVIL_PORT}}; then
          echo "❌ WAVS chain not running on port {{.ANVIL_PORT}}"
          echo "Start it with: task anvil:start"
          exit 1
        fi
        
        echo "🚀 Deploying Gacha system using Forge script..."
        forge script script/DeployLocal.s.sol:DeployLocal \
          --rpc-url http://localhost:{{.ANVIL_PORT}} \
          --broadcast \
          --private-key $PRIVATE_KEY
    preconditions:
      - sh: '[ -n "$PRIVATE_KEY" ]'
        msg: "PRIVATE_KEY environment variable is required"
    deps: [build]