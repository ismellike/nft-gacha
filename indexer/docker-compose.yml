services:
  indexer:
    build: .
    container_name: gacha-indexer
    restart: unless-stopped
    ports:
      - "${PORT:-42069}:42069"
    environment:
      - RPC_URL=${RPC_URL:-http://host.docker.internal:8545}
      - GACHA_ADDRESS=${GACHA_ADDRESS:?GACHA_ADDRESS is required}
      - TREASURY_ADDRESS=${TREASURY_ADDRESS:?TREASURY_ADDRESS is required}
      - CHAIN_ID=${CHAIN_ID:-31337}
      - START_BLOCK=${START_BLOCK:-0}
      - PORT=42069
    volumes:
      - ponder-data:/app/.ponder
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:42069/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ponder-data:
