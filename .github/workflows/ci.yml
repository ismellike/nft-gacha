name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Smart Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install contract dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: forge build

      - name: Check formatting
        run: forge fmt --check

      - name: Run tests
        run: forge test

      - name: Gas snapshot
        run: forge snapshot --check || forge snapshot

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install contract dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: forge build

      - uses: crytic/slither-action@v0.4.2
        with:
          target: contracts/
          slither-config: contracts/slither.config.json
          fail-on: high

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            contracts/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install contract dependencies
        run: pnpm install --frozen-lockfile
        working-directory: contracts

      - name: Build contracts
        run: forge build
        working-directory: contracts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify codegen is up to date
        run: |
          pnpm codegen
          git diff --exit-code src/generated.ts

      - name: Type check
        run: pnpm tsc

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:run

      - name: Check dead code
        run: pnpm deadcode

  rust:
    name: Rust / WASI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests (native)
        run: cargo test --workspace

      - name: Cargo build (wasm32-wasip2)
        run: cargo build --target wasm32-wasip2
