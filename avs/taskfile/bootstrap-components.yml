version: "3"

vars:
  # Component-specific variable definitions
  COMPONENTS_DIR: '{{joinPath .ROOT_DIR "components"}}'
  # Array of components to build/upload/test
  WASI_COMPONENTS:
    - nft_appraisal
    - wavs_drand

tasks:
  components-build:
    desc: "Builds the WASI components (nft-appraisal and wavs-drand)"
    deps: [components-clean]
    requires:
      vars: [PROJECT, REPO_ROOT, ROOT_DIR]
    cmds:
      - for: { var: WASI_COMPONENTS }
        cmd: |
          COMPONENT_DIR="{{joinPath .COMPONENTS_DIR (.ITEM | replace "_" "-")}}"
          cd "{{.REPO_ROOT}}" && task component:build PROJECT="{{.PROJECT}}" COMPONENT_NAME="{{.ITEM}}" COMPONENT_SOURCE_DIR="$COMPONENT_DIR"

  components-clean:
    desc: "Deletes the WASI components (nft-appraisal and wavs-drand)"
    requires:
      vars: [PROJECT, REPO_ROOT]
    cmds:
      - for: { var: WASI_COMPONENTS }
        cmd: cd "{{.REPO_ROOT}}" && task component:clean-all PROJECT="{{.PROJECT}}" COMPONENT_NAME="{{.ITEM}}"

  components-upload:
    desc: "Uploads the WASI components (nft-appraisal and wavs-drand)"
    vars:
      WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
      WAVS_ENDPOINT:
        sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-endpoint-{{.WAVS_INSTANCE}}
    requires:
      vars: [PROJECT, REPO_ROOT]
    cmds:
      - for: { var: WASI_COMPONENTS }
        cmd: cd "{{.REPO_ROOT}}" && task component:upload PROJECT="{{.PROJECT}}" COMPONENT_NAME="{{.ITEM}}" WAVS_ENDPOINT="{{.WAVS_ENDPOINT}}"

  components-test:
    desc: "Test the WASI components"
    requires:
      vars: [PROJECT, REPO_ROOT]
    cmds:
      - for: { var: WASI_COMPONENTS }
        cmd: |
          COMPONENT_DIR="{{joinPath .COMPONENTS_DIR (.ITEM | replace "_" "-")}}"
          cd "$COMPONENT_DIR" && cargo test