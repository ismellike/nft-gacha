version: "3"

includes:
  bootstrap-common:
    taskfile: ./bootstrap-common.yml
    flatten: true

tasks:
  contracts:
    desc: "Deploy contracts with WAVS service manager address"
    vars:
      WAVS_SERVICE_MANAGER_ADDRESS:
        sh: task get-service-manager-address
    cmds:
      - cd "{{.REPO_ROOT}}" && task contracts:deploy WAVS_SERVICE_MANAGER_ADDRESS="{{.WAVS_SERVICE_MANAGER_ADDRESS}}"

  build-service:
    desc: "Build service configuration"
    deps: [clean-service]
    vars:
      SERVICE_JSON_CMD: 'service --json true --home /wavs-home --file "{{.WAVS_CLI_SERVICE_JSON_PATH}}"'
      TRIGGER_CHAIN: "local"
      SUBMIT_CHAIN: "local"
      SERVICE_MANAGER_ADDRESS:
        sh: task get-service-manager-address
      RANDOMNESS_REQUESTED_EVENT_HASH:
        sh: cast keccak "RandomnessRequested(uint256)"
    cmds:
      - |
        cd "{{.REPO_ROOT}}"
        mkdir -p {{.SERVICE_OUTPUT_DIR}}

        # Build service configuration using task cli:wavs
        task cli:wavs -- {{.SERVICE_JSON_CMD}} init --name {{.COMPONENT_NAME}}

        WORKFLOW_ID=$(task cli:wavs -- {{.SERVICE_JSON_CMD}} workflow add | jq -r .workflow_id)

        task cli:wavs -- {{.SERVICE_JSON_CMD}} workflow trigger --id ${WORKFLOW_ID} set-evm --chain-name {{.TRIGGER_CHAIN}} --address ${GACHA_CONTRACT_ADDRESS} --event-hash {{.RANDOMNESS_REQUESTED_EVENT_HASH}}
          
        task cli:wavs -- {{.SERVICE_JSON_CMD}} workflow submit --id ${WORKFLOW_ID} set-aggregator --url {{.WAVS_AGGREGATOR_ENDPOINT}} --address ${GACHA_SERVICE_HANDLER_ADDRESS} --chain-name {{.SUBMIT_CHAIN}}

        task cli:wavs -- {{.SERVICE_JSON_CMD}} workflow component --id ${WORKFLOW_ID} set-source-registry --package {{.COMPONENT_PACKAGE}}
          
        task cli:wavs -- {{.SERVICE_JSON_CMD}} workflow component --id ${WORKFLOW_ID} permissions --http-hosts '*' --file-system true
          
        task cli:wavs -- {{.SERVICE_JSON_CMD}} manager set-evm --chain-name {{.SUBMIT_CHAIN}} --address {{.SERVICE_MANAGER_ADDRESS}}

        echo "Service configuration built successfully"
