version: "3"

silent: true

dotenv: [".env", ".env.local"]

includes:
  nft:
    taskfile: ./taskfile/nft.yml
  contracts:
    taskfile: ./taskfile/contracts.yml
  frontend:
    taskfile: ./taskfile/frontend.yml
  backend:
    taskfile: ./taskfile/backend.yml
  middleware:
    taskfile: ./taskfile/middleware.yml
  cli:
    taskfile: ./taskfile/cli.yml
  pricing:
    taskfile: ./taskfile/pricing.yml
  component:
    taskfile: ./taskfile/component.yml

tasks:
  clean-env:
    desc: Clean .env.local file to ensure fresh addresses
    cmds:
      - |
        if [ -f .env.local ]; then
          rm .env.local
        fi

  pnpm-install:
    dir: contracts
    cmds:
      - pnpm i

  init-submodules:
    dir: contracts
    cmds:
      - git submodule update --init --recursive --remote --force

  bootstrap:
    deps: [clean-env, init-submodules, pnpm-install]
    cmds:
      - |
        task backend:start 
        task bootstrap-avs
        task frontend:codegen
        task frontend:sync-env
        task frontend:dev

  bootstrap-avs:
    dir: "avs"
    cmds:
      - task bootstrap

  lint:
    desc: "Run code formatting and linting checks"
    cmds:
      - cargo fmt --all -- --check
      - cargo fix --allow-dirty --allow-staged
      - cargo clippy --all-targets -- -D warnings
