version: "3"

silent: true

dotenv: [".env", ".env.local"]

includes:
  anvil:
    taskfile: ./taskfile/anvil.yml
  nft:
    taskfile: ./taskfile/nft.yml
  contracts:
    taskfile: ./taskfile/contracts.yml
  frontend:
    taskfile: ./taskfile/frontend.yml
  backend:
    taskfile: ./taskfile/backend.yml
  middleware:
    taskfile: ./taskfile/middleware.yml
  cli:
    taskfile: ./taskfile/cli.yml

tasks:
  bootstrap:
    cmds:
      - |
        task backend:start 
        task bootstrap-avs
        task frontend:codegen
        task frontend:sync-env
        task contracts:mint-eth
        task contracts:mint-tokens
        task frontend:dev

  bootstrap-avs:
    dir: "avs"
    cmds:
      - task bootstrap
