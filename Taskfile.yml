version: "3"

silent: true

dotenv: [".env", ".env.local"]

includes:
  anvil:
    taskfile: ./taskfiles/anvil.yml
  nft:
    taskfile: ./taskfiles/nft.yml
  contracts:
    taskfile: ./taskfiles/contracts.yml
  frontend:
    taskfile: ./taskfiles/frontend.yml
  backend:
    taskfile: ./taskfiles/backend.yml

tasks:
  bootstrap:
    cmds:
      - |
        task backend:start 
        task contracts:deploy
        task frontend:codegen
        task frontend:sync-env
        task frontend:dev
