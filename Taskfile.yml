version: "3"

silent: true

dotenv: [".env", ".env.local"]

includes:
  nft:
    taskfile: ./taskfile/nft.yml
  contracts:
    taskfile: ./taskfile/contracts.yml
  frontend:
    taskfile: ./taskfile/frontend.yml
  backend:
    taskfile: ./taskfile/backend.yml
  middleware:
    taskfile: ./taskfile/middleware.yml
  cli:
    taskfile: ./taskfile/cli.yml
  pricing:
    taskfile: ./taskfile/pricing.yml

tasks:
  clean-env:
    desc: Clean .env.local file to ensure fresh addresses
    cmds:
      - |
        if [ -f .env.local ]; then
          rm .env.local
          echo "🧹 Removed old .env.local file"
        fi

  init-submodules:
    dir: contracts
    cmds:
      - git submodule update --init --recursive

  bootstrap:
    deps: [clean-env, init-submodules]
    cmds:
      - |
        task backend:start 
        task bootstrap-avs
        task frontend:codegen
        task frontend:sync-env
        task frontend:dev

  bootstrap-avs:
    dir: "avs"
    cmds:
      - task bootstrap
