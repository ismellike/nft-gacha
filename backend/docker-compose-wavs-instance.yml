services:
  wavs:
    image: "${COMPOSE_WAVS_DOCKER_IMAGE:-}"
    container_name: "${COMPOSE_PROJECT_NAME:-}"
    stop_signal: SIGKILL
    environment:
      - WAVS_SUBMISSION_MNEMONIC=${WAVS_SUBMISSION_MNEMONIC:-}
      - WAVS_ENV_SCRYDEX_API_KEY=${WAVS_ENV_SCRYDEX_API_KEY:-}
      - WAVS_ENV_SCRYDEX_TEAM_ID=${WAVS_ENV_SCRYDEX_TEAM_ID:-}
    command:
      [
        "wavs",
        "--home",
        "/wavs-home",
        "--data",
        "/var/${COMPOSE_PROJECT_NAME:-}",
        "--port",
        "${COMPOSE_WAVS_PORT:-}",
      ]
    volumes:
      - "${COMPOSE_WAVS_HOME:-}:/wavs-home"
    network_mode: "host"
