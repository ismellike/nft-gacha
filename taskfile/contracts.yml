version: "3"

includes:
    backend:
        taskfile: ./backend.yml

vars:
    CONTRACTS_DIR: ./contracts
    # Use the first WAVS Anvil chain (port 8548)
    ANVIL_PORT: 8548

tasks:
    build:
        desc: Build smart contracts
        dir: "{{.CONTRACTS_DIR}}"
        sources:
            - "src/**/*.sol"
            - "foundry.toml"
        generates:
            - "out/**/*.json"
        cmds:
            - forge build

    test:
        desc: Run smart contract tests
        dir: "{{.CONTRACTS_DIR}}"
        cmds:
            - forge test

    test:unit:
        desc: Run only unit tests (excludes fuzz, invariant, integration, stress)
        dir: "{{.CONTRACTS_DIR}}"
        cmds:
            - forge test --match-path "test/unit/*"

    test:fuzz:
        desc: Run only fuzz tests
        dir: "{{.CONTRACTS_DIR}}"
        cmds:
            - forge test --match-path "test/fuzz/*"

    test:integration:
        desc: Run only integration tests
        dir: "{{.CONTRACTS_DIR}}"
        cmds:
            - forge test --match-path "test/integration/*"

    slither:
        desc: Run Slither static analysis on contracts
        dir: "{{.CONTRACTS_DIR}}"
        cmds:
            - slither .

    snapshot:
        desc: Generate gas snapshots
        dir: "{{.CONTRACTS_DIR}}"
        sources:
            - "src/**/*.sol"
            - "test/**/*.sol"
            - "foundry.toml"
        generates:
            - ".gas-snapshot"
        cmds:
            - forge snapshot

    deploy:
        desc: Deploy Gacha system contracts using Forge script
        dir: "{{.CONTRACTS_DIR}}"
        vars:
            DEPLOY_RPC_URL:
                sh: task backend:get-evm-rpc-url-1
            DEPLOY_CHAIN_ID:
                sh: cast chain-id --rpc-url $(task backend:get-evm-rpc-url-1)
        requires:
            vars: [WAVS_SERVICE_MANAGER_ADDRESS]
        env:
            WAVS_SERVICE_MANAGER_ADDRESS: "{{.WAVS_SERVICE_MANAGER_ADDRESS}}"
            DEPLOY_ENV: "{{.DEPLOY_ENV}}"
            CHAIN_ID: "{{.DEPLOY_CHAIN_ID}}"
            RPC_URL: "{{.DEPLOY_RPC_URL}}"
            USDC_TOKEN_ADDRESS: "{{.USDC_TOKEN_ADDRESS}}"
        cmds:
            - |
                forge script script/DeployLocal.s.sol:DeployLocal \
                  --rpc-url {{.DEPLOY_RPC_URL}} \
                  --broadcast \
                  --slow \
                  --private-key $DEPLOYER_PRIVATE_KEY
        preconditions:
            - sh: '[ -n "$DEPLOYER_PRIVATE_KEY" ]'
              msg: "DEPLOYER_PRIVATE_KEY environment variable is required"
        deps: [build]

    deploy-testnet:
        desc: Deploy Gacha system contracts to a public testnet
        dir: "{{.CONTRACTS_DIR}}"
        vars:
            DEPLOY_RPC_URL:
                sh: task backend:get-evm-rpc-url-1
            DEPLOY_CHAIN_ID:
                sh: cast chain-id --rpc-url $(task backend:get-evm-rpc-url-1)
        requires:
            vars: [WAVS_SERVICE_MANAGER_ADDRESS]
        env:
            WAVS_SERVICE_MANAGER_ADDRESS: "{{.WAVS_SERVICE_MANAGER_ADDRESS}}"
            DEPLOY_ENV: TESTNET
            CHAIN_ID: "{{.DEPLOY_CHAIN_ID}}"
            RPC_URL: "{{.DEPLOY_RPC_URL}}"
            USDC_TOKEN_ADDRESS: "{{.USDC_TOKEN_ADDRESS}}"
            SPIN_FEE: "{{.SPIN_FEE}}"
        cmds:
            - |
                VERIFY_FLAGS=""
                if [ -n "$ETHERSCAN_API_KEY" ]; then
                  VERIFY_FLAGS="--verify --etherscan-api-key $ETHERSCAN_API_KEY"
                  echo "Contract verification enabled"
                else
                  echo "Warning: ETHERSCAN_API_KEY not set, skipping contract verification"
                fi
                forge script script/DeployTestnet.s.sol:DeployTestnet \
                  --rpc-url {{.DEPLOY_RPC_URL}} \
                  --broadcast \
                  --slow \
                  --private-key $DEPLOYER_PRIVATE_KEY \
                  $VERIFY_FLAGS
        preconditions:
            - sh: '[ -n "$DEPLOYER_PRIVATE_KEY" ]'
              msg: "DEPLOYER_PRIVATE_KEY environment variable is required"
            - sh: '[ "{{.DEPLOY_ENV}}" = "TESTNET" ]'
              msg: "DEPLOY_ENV must be set to TESTNET (current: {{.DEPLOY_ENV}})"
        deps: [build]
