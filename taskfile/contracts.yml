version: "3"

includes:
  backend:
    taskfile: ./backend.yml

vars:
  CONTRACTS_DIR: ./contracts
  # Use the first WAVS Anvil chain (port 8548)
  ANVIL_PORT: 8548

tasks:
  build:
    desc: Build smart contracts
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - forge build

  test:
    desc: Run smart contract tests
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - forge test

  deploy:
    desc: Deploy Gacha system contracts to WAVS chain using Forge script
    dir: "{{.CONTRACTS_DIR}}"
    requires:
      vars: [WAVS_SERVICE_MANAGER_ADDRESS]
    env:
      WAVS_SERVICE_MANAGER_ADDRESS: "{{.WAVS_SERVICE_MANAGER_ADDRESS}}"
    cmds:
      - |
        # Check if WAVS chain is running
        if ! nc -z localhost {{.ANVIL_PORT}}; then
          echo "❌ WAVS chain not running on port {{.ANVIL_PORT}}"
          echo "Start it with: task anvil:start"
          exit 1
        fi

        echo "🚀 Deploying Gacha system using Forge script..."

        forge script script/DeployLocal.s.sol:DeployLocal \
          --rpc-url http://localhost:{{.ANVIL_PORT}} \
          --broadcast \
          --private-key $DEPLOYER_PRIVATE_KEY
    preconditions:
      - sh: '[ -n "$DEPLOYER_PRIVATE_KEY" ]'
        msg: "DEPLOYER_PRIVATE_KEY environment variable is required"
    deps: [build]

  mint-tokens:
    desc: "Mint test tokens to address specified in USER_ADDRESS env var"
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - |
        echo "💰 Minting 100,000 TEST tokens to $USER_ADDRESS..."
        forge script script/MintTestTokens.s.sol:MintTestTokens \
          --rpc-url http://localhost:{{.ANVIL_PORT}} \
          --broadcast \
          --private-key $DEPLOYER_PRIVATE_KEY

  mint-eth:
    desc: "Mint testnet ETH to address specified in USER_ADDRESS env var"
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - |
        echo "💰 Minting 10 ETH to $USER_ADDRESS..."
        cast send --value 10ether $USER_ADDRESS \
          --rpc-url http://localhost:{{.ANVIL_PORT}} \
          --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
