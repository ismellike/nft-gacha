version: "3"

includes:
    backend:
        taskfile: ./backend.yml

vars:
    CONTRACTS_DIR: ./contracts
    # Use the first WAVS Anvil chain (port 8548)
    ANVIL_PORT: 8548

tasks:
    build:
        desc: Build smart contracts
        dir: "{{.CONTRACTS_DIR}}"
        cmds:
            - forge build

    test:
        desc: Run smart contract tests
        dir: "{{.CONTRACTS_DIR}}"
        cmds:
            - forge test

    deploy:
        desc: Deploy Gacha system contracts using Forge script
        dir: "{{.CONTRACTS_DIR}}"
        vars:
            DEPLOY_RPC_URL:
                sh: task backend:get-evm-rpc-url-1
            DEPLOY_CHAIN_ID:
                sh: cast chain-id --rpc-url $(task backend:get-evm-rpc-url-1)
        requires:
            vars: [WAVS_SERVICE_MANAGER_ADDRESS]
        env:
            WAVS_SERVICE_MANAGER_ADDRESS: "{{.WAVS_SERVICE_MANAGER_ADDRESS}}"
            DEPLOY_ENV: "{{.DEPLOY_ENV}}"
            CHAIN_ID: "{{.DEPLOY_CHAIN_ID}}"
            RPC_URL: "{{.DEPLOY_RPC_URL}}"
            USDC_TOKEN_ADDRESS: "{{.USDC_TOKEN_ADDRESS}}"
        cmds:
            - |
                forge script script/DeployLocal.s.sol:DeployLocal \
                  --rpc-url {{.DEPLOY_RPC_URL}} \
                  --broadcast \
                  --private-key $DEPLOYER_PRIVATE_KEY
        preconditions:
            - sh: '[ -n "$DEPLOYER_PRIVATE_KEY" ]'
              msg: "DEPLOYER_PRIVATE_KEY environment variable is required"
        deps: [build]
