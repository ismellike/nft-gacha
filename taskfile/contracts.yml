version: "3"

includes:
  backend:
    taskfile: ./backend.yml

vars:
  CONTRACTS_DIR: ./contracts
  # Use the first WAVS Anvil chain (port 8548)
  ANVIL_PORT: 8548

tasks:
  build:
    desc: Build smart contracts
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - forge build

  test:
    desc: Run smart contract tests
    dir: "{{.CONTRACTS_DIR}}"
    cmds:
      - forge test

  deploy:
    desc: Deploy Gacha system contracts to WAVS chain using Forge script
    dir: "{{.CONTRACTS_DIR}}"
    requires:
      vars: [WAVS_SERVICE_MANAGER_ADDRESS]
    env:
      WAVS_SERVICE_MANAGER_ADDRESS: "{{.WAVS_SERVICE_MANAGER_ADDRESS}}"
    cmds:
      - |
        forge script script/DeployLocal.s.sol:DeployLocal \
          --rpc-url http://localhost:{{.ANVIL_PORT}} \
          --broadcast \
          --skip-simulation \
          --private-key $DEPLOYER_PRIVATE_KEY
    preconditions:
      - sh: '[ -n "$DEPLOYER_PRIVATE_KEY" ]'
        msg: "DEPLOYER_PRIVATE_KEY environment variable is required"
    deps: [build]
