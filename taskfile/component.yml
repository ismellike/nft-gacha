version: "3"

includes:
  config:
    taskfile: ./config.yml
    flatten: true
  docker:
    taskfile: ./docker.yml
    flatten: true

tasks:
  build:
    desc: "Build a WASI component from Rust source"
    vars:
      COMPONENT_OUTPUT_DIR:
        sh: task component:get-output-dir
    requires:
      vars: [COMPONENT_NAME, COMPONENT_SOURCE_DIR]
    preconditions:
      - test -d "{{.COMPONENT_SOURCE_DIR}}"
      - test -f "{{.COMPONENT_SOURCE_DIR}}/Cargo.toml"
      - sh: "command -v cargo"
        msg: "Rust cargo is required but not installed"
      - sh: "cargo component --version"
        msg: "cargo-component is required but not installed"
    sources:
      - "{{.COMPONENT_SOURCE_DIR}}/src/**/*.rs"
      - "{{.COMPONENT_SOURCE_DIR}}/Cargo.toml"
    generates:
      - "{{.COMPONENT_OUTPUT_DIR}}/{{.COMPONENT_NAME}}.wasm"
    cmds:
      - |
        echo "Building component: {{.COMPONENT_NAME}}"
        cd "{{.COMPONENT_SOURCE_DIR}}"
        cargo build --release --target wasm32-wasip2
        mkdir -p {{.COMPONENT_OUTPUT_DIR}}
        cp "{{.COMPONENTS_CARGO_RELEASE_DIR}}/{{.COMPONENT_NAME}}.wasm" {{.COMPONENT_OUTPUT_DIR}}/

  clean-single:
    desc: "Delete a specific WASI component binary"
    vars:
      COMPONENT_OUTPUT_DIR:
        sh: task component:get-output-dir
    requires:
      vars: [COMPONENT_NAME]
    cmds:
      - rm -f "{{.COMPONENT_OUTPUT_DIR}}/{{.COMPONENT_NAME}}.wasm"

  clean-all:
    desc: "Delete all WASI component binaries for a project"
    vars:
      COMPONENT_OUTPUT_DIR:
        sh: task component:get-output-dir
    cmds:
      - rm -rf "{{.COMPONENT_OUTPUT_DIR}}"

  upload-to-ipfs:
    desc: "Upload a WASI component to IPFS"
    requires:
      vars: [COMPONENT_NAME]
    vars:
      COMPONENT_WASM: "{{.COMPONENTS_CARGO_RELEASE_DIR}}/{{.COMPONENT_NAME}}.wasm"
      OUTPUT_DIR: "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components"
      OUTPUT_FILE: "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/{{.COMPONENT_NAME}}-cid.json"
    preconditions:
      - test -f "{{.COMPONENT_WASM}}"
      - sh: "nc -z 127.0.0.1 {{.IPFS_API_PORT}} 2>/dev/null"
        msg: "IPFS node is not running. Start it with: task backend:start-ipfs"
    cmds:
      - echo "📤 Uploading {{.COMPONENT_NAME}} to IPFS..."
      - mkdir -p "{{.OUTPUT_DIR}}"
      - |
          CID=$(curl -s -X POST "{{.IPFS_API_URL}}/api/v0/add?pin=true" \
            -F file=@{{.COMPONENT_WASM}} | jq -r '.Hash')

          if [ -z "$CID" ] || [ "$CID" = "null" ]; then
            echo "❌ Failed to upload component to IPFS"
            exit 1
          fi

          echo "✅ Component CID: $CID"
          echo "{\"cid\":\"$CID\",\"ipfs_url\":\"ipfs://$CID\",\"gateway_url\":\"http://localhost:{{.IPFS_GATEWAY_PORT}}/ipfs/$CID\"}" > "{{.OUTPUT_FILE}}"
      - echo "✅ CID saved to {{.OUTPUT_FILE}}"

  upload-to-aggregator-ipfs:
    desc: "Upload a WASI component to IPFS for aggregator"
    requires:
      vars: [COMPONENT_NAME]
    vars:
      COMPONENT_WASM: "{{.COMPONENTS_CARGO_RELEASE_DIR}}/{{.COMPONENT_NAME}}.wasm"
      OUTPUT_DIR: "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components"
      OUTPUT_FILE: "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/{{.COMPONENT_NAME}}-cid.json"
    preconditions:
      - test -f "{{.COMPONENT_WASM}}"
      - sh: "nc -z 127.0.0.1 {{.IPFS_API_PORT}} 2>/dev/null"
        msg: "IPFS node is not running. Start it with: task backend:start-ipfs"
    cmds:
      - echo "📤 Uploading {{.COMPONENT_NAME}} to IPFS (aggregator)..."
      - mkdir -p "{{.OUTPUT_DIR}}"
      - |
          CID=$(curl -s -X POST "{{.IPFS_API_URL}}/api/v0/add?pin=true" \
            -F file=@{{.COMPONENT_WASM}} | jq -r '.Hash')

          if [ -z "$CID" ] || [ "$CID" = "null" ]; then
            echo "❌ Failed to upload component to IPFS"
            exit 1
          fi

          echo "✅ Component CID: $CID"
          echo "{\"cid\":\"$CID\",\"ipfs_url\":\"ipfs://$CID\",\"gateway_url\":\"http://localhost:{{.IPFS_GATEWAY_PORT}}/ipfs/$CID\"}" > "{{.OUTPUT_FILE}}"

  upload-to-wavs:
    desc: "[DEPRECATED] Upload a WASI component to the WAVS endpoint"
    requires:
      vars: [COMPONENT_NAME, WAVS_ENDPOINT]
    vars:
      # here it's relative to docker volume mount, where /nft-gacha is the root of this repo
      COMPONENT_BINARY: "/nft-gacha/{{.PROJECT_OUTPUT_DIRNAME}}/components/{{.COMPONENT_NAME}}.wasm"
      DATA_DIR: "/nft-gacha/{{.PROJECT_OUTPUT_DIRNAME}}/.wavs-cli-data"
      COMPONENT_DIGEST_FILE:
        sh: task component:get-digest-filepath COMPONENT_NAME={{.COMPONENT_NAME}}
    cmds:
      # unfortunately, the wavs-cli upload-component command doesn't write to JSON
      # but, fortunately, the last line of the output is the digest
      - |
        OUTPUT=$(task component:docker-upload WAVS_ENDPOINT="{{.WAVS_ENDPOINT}}" -- "{{.COMPONENT_BINARY}}" --data "{{.DATA_DIR}}")
        DIGEST=$(echo "$OUTPUT" | tail -n 1)
        if [[ "$OUTPUT" == *"Digest"* ]]; then
          echo "Component uploaded successfully, digest is $DIGEST"
          echo "$DIGEST" > "{{.COMPONENT_DIGEST_FILE}}"
        else
          echo "Failed to upload component."
          exit 1
        fi

  upload-to-aggregator-wavs:
    desc: "[DEPRECATED] Upload a WASI component to the WAVS aggregator endpoint"
    requires:
      vars: [COMPONENT_NAME, WAVS_AGGREGATOR_ENDPOINT]
    vars:
      COMPONENT_BINARY: "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/{{.COMPONENT_NAME}}.wasm"
      COMPONENT_DIGEST_FILE:
        sh: task component:get-digest-filepath COMPONENT_NAME={{.COMPONENT_NAME}}
    cmds:
      - |
        echo "Uploading component {{.COMPONENT_NAME}} to {{.WAVS_AGGREGATOR_ENDPOINT}}/dev/components"

        RESPONSE=$(curl --fail-with-body -X POST "{{.WAVS_AGGREGATOR_ENDPOINT}}/dev/components" \
          -H "Content-Type: application/octet-stream" \
          --data-binary "@{{.COMPONENT_BINARY}}" \
          2>/dev/null)

        if [ $? -eq 0 ]; then
          DIGEST=$(echo "$RESPONSE" | jq -r '.digest')
          if [ "$DIGEST" != "null" ] && [ -n "$DIGEST" ]; then
            echo "Component uploaded successfully, digest is $DIGEST"
            echo "$DIGEST" > "{{.COMPONENT_DIGEST_FILE}}"
          else
            echo "Error: Failed to parse digest from response: $RESPONSE"
            exit 1
          fi
        else
          echo "Error: Failed to upload component"
          echo "Response: $RESPONSE"
          exit 1
        fi

  docker-upload:
    desc: "Upload component via Docker container"
    requires:
      vars: [WAVS_ENDPOINT]
    cmds:
      - >
        {{.DOCKER_SUDO}} docker run --rm --network host
        -v {{.REPO_ROOT}}:/nft-gacha
        -v {{.WAVS_HOME_DIR}}:/wavs-home 
        {{.WAVS_DOCKER_IMAGE}}
        wavs-cli upload-component {{.CLI_ARGS}} --json true --home /wavs-home --wavs-endpoint {{.WAVS_ENDPOINT}}

  get-output-dir:
    desc: "Get the path to the component output directory"
    vars:
      OUTPUT_DIR: '{{joinPath .REPO_ROOT .PROJECT_OUTPUT_DIRNAME "components"}}'
    cmds:
      - echo "{{.OUTPUT_DIR}}"

  get-digest-filepath:
    desc: "Get the path to the component digest file"
    vars:
      OUTPUT_DIR:
        sh: task component:get-output-dir
    requires:
      vars: [COMPONENT_NAME]
    cmds:
      - echo "{{.OUTPUT_DIR}}/{{.COMPONENT_NAME}}.digest"

  ###################################################################
  ######################## WIT #####################################
  ###################################################################

  clean-wit:
    cmds:
      - echo "Cleaning WIT"
      - rm -rf "wit-worlds"

  fetch-wit:
    cmds:
      - task: download-wit
      - cd "{{.WIT_DEFINITIONS_DIR}}/operator" && wkg wit fetch
      - cd "{{.WIT_DEFINITIONS_DIR}}/aggregator" && wkg wit fetch

  download-wit:
    internal: true
    deps: [clean-wit]
    vars:
      BRANCH: '{{.BRANCH | default "main"}}'
      TEMP_CLONE_PATH: ".temp-clone"
    cmds:
      - echo "Downloading WIT worlds from {{.BRANCH}} branch"
      - rm -rf "{{.TEMP_CLONE_PATH}}"
      - mkdir -p "{{.TEMP_CLONE_PATH}}"
      - rm -rf "{{.WIT_DEFINITIONS_DIR}}"
      - mkdir -p "{{.WIT_DEFINITIONS_DIR}}"
      - git -C "{{.TEMP_CLONE_PATH}}" clone --depth=1 --branch {{.BRANCH}} --single-branch https://github.com/Lay3rLabs/wavs-wasi.git
      - cp -R "{{.TEMP_CLONE_PATH}}"/wavs-wasi/wit-definitions/* "{{.WIT_DEFINITIONS_DIR}}/"
      - rm -rf "{{.TEMP_CLONE_PATH}}"

  ###################################################################
  ######################## IPFS #####################################
  ###################################################################

  get-cid:
    desc: "Get component CID from build artifacts"
    requires:
      vars: [COMPONENT_NAME]
    vars:
      CID_FILE: "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/{{.COMPONENT_NAME}}-cid.json"
    preconditions:
      - sh: "[ -f '{{.CID_FILE}}' ]"
        msg: "CID file not found. Upload component to IPFS first."
    cmds:
      - jq -r '.cid' "{{.CID_FILE}}"

  get-ipfs-url:
    desc: "Get component IPFS URL from build artifacts"
    requires:
      vars: [COMPONENT_NAME]
    vars:
      CID_FILE: "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/{{.COMPONENT_NAME}}-cid.json"
    preconditions:
      - sh: "[ -f '{{.CID_FILE}}' ]"
        msg: "CID file not found. Upload component to IPFS first."
    cmds:
      - jq -r '.ipfs_url' "{{.CID_FILE}}"

  verify-ipfs:
    desc: "Verify IPFS node is running and accessible"
    cmds:
      - |
          if nc -z 127.0.0.1 {{.IPFS_API_PORT}} 2>/dev/null; then
            echo "✅ IPFS node is running on port {{.IPFS_API_PORT}}"
            echo "Gateway available at: http://localhost:{{.IPFS_GATEWAY_PORT}}/ipfs/<CID>"
          else
            echo "❌ IPFS node is not accessible"
            echo "Start it with: task backend:start-ipfs"
            exit 1
          fi
