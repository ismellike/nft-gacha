version: "3"

includes:
    cli: ./cli.yml
    middleware: ./middleware.yml
    backend: ./backend.yml
    contracts: ./contracts.yml
    config:
        taskfile: ./config.yml
        flatten: true
    docker:
        taskfile: ./docker.yml
        flatten: true
    ipfs:
        taskfile: ./ipfs.yml
        internal: true

silent: true

vars:
    COMPONENTS_DIR: '{{joinPath .REPO_ROOT "packages"}}'
    WASI_COMPONENTS:
        - nft_appraisal
        - wavs_drand
        - aggregator_simple
    WAVS_CLI_SERVICE_JSON_PATH: "/nft-gacha/.project-output/services/{{.AVS_SERVICE_NAME}}.json"
    # Common prefix for all WAVS CLI service commands
    WAVS_SERVICE_CMD: 'service --json true --home /wavs-home --file "{{.WAVS_CLI_SERVICE_JSON_PATH}}"'
    PROJECT_OUTPUT_DIR: '{{joinPath .REPO_ROOT ".project-output"}}'
    SERVICE_OUTPUT_DIR: '{{joinPath .PROJECT_OUTPUT_DIR "services"}}'
    SERVICE_JSON_PATH: "{{.SERVICE_OUTPUT_DIR}}/{{.AVS_SERVICE_NAME}}.json"
    SERVICE_CID_JSON_PATH: "{{.SERVICE_OUTPUT_DIR}}/service-cid.json"
    # Contract addresses env file: .env.local for LOCAL, .env.testnet for TESTNET, .env.mainnet for MAINNET
    CONTRACT_ENV_FILE: '{{if eq .DEPLOY_ENV "MAINNET"}}.env.mainnet{{else if eq .DEPLOY_ENV "TESTNET"}}.env.testnet{{else}}.env.local{{end}}'

tasks:
    bootstrap:
        desc: "Complete AVS deployment middleware components contracts service and registration"
        vars:
            CHAIN_NUMBER: '{{.SOURCE_CHAIN_NUMBER | default "1"}}'
            QUORUM_NUMERATOR: '{{.QUORUM_NUMERATOR | default "1"}}'
            QUORUM_DENOMINATOR: '{{.QUORUM_DENOMINATOR | default "2"}}'
            OPERATORS: '{{.OPERATORS | default "1"}}'
        deps: [clean]
        cmds:
            - echo "Starting AVS bootstrap..."
            - task: prerequisites
            - task: fund-deployer
            - task: middleware-deploy
            - task: components-build
            - task: components-upload
            - task: contracts-deploy
            - task: build-service
            - task: upload-service
            - task: set-service-uri
            - task: deploy-service-to-all-operators
            - task: register-operators
            - task: update-quorum
            - task: register-service
            - echo "Bootstrap complete!"

    deploy-service-to-all-operators:
        desc: "Deploy service to all running WAVS operators"
        internal: true
        cmds:
            - |
                # Deploy service to ALL operators (required before registration)
                for i in $(docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep '^wavs-operator-' | grep -oE '[0-9]+$' | sort -n); do
                  echo "Deploying service to operator #$i..."
                  task avs:deploy-service WAVS_INSTANCE="$i"
                done

    prerequisites:
        desc: "Ensure backend infrastructure is running before deployment"
        vars:
            CHAINS: '{{.CHAINS | default "1"}}'
            OPERATORS: '{{.OPERATORS | default "1"}}'
        cmds:
            - echo "Checking prerequisites..."
            - task backend:start CHAINS="{{.CHAINS}}" OPERATORS="{{.OPERATORS}}"
            - echo "Backend infrastructure ready"

    fund-deployer:
        desc: "Fund the deployer account on the LOCAL Anvil chain (no-op on TESTNET/MAINNET)"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            FUND_WEI: '{{.FUND_WEI | default "0x21E19E0C9BAB2400000"}}' # 10,000 ETH
            DEPLOY_RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
        cmds:
            - |
                if [ "{{.DEPLOY_ENV}}" != "LOCAL" ]; then
                  echo "DEPLOY_ENV={{.DEPLOY_ENV}} — skipping deployer funding (only funds on LOCAL Anvil)"
                  exit 0
                fi
                if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
                  echo "Error: DEPLOYER_PRIVATE_KEY is not set" >&2
                  exit 1
                fi
                DEPLOYER_ADDR=$(cast wallet address "$DEPLOYER_PRIVATE_KEY")
                echo "Funding deployer $DEPLOYER_ADDR on {{.DEPLOY_RPC_URL}}..."
                cast rpc anvil_setBalance "$DEPLOYER_ADDR" "{{.FUND_WEI}}" --rpc-url "{{.DEPLOY_RPC_URL}}" >/dev/null
                echo "Deployer balance: $(cast from-wei "$(cast balance "$DEPLOYER_ADDR" --rpc-url "{{.DEPLOY_RPC_URL}}")") ETH"

    register-operators:
        desc: "Register all running WAVS operators with POA middleware"
        vars:
            WEIGHT: '{{.WEIGHT | default "10000000"}}'
        cmds:
            - |
                # Find all running WAVS operators and register them
                OPERATOR_COUNT=$(docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep '^wavs-operator-' | grep -oE '[0-9]+$' | sort -n | wc -l)
                if [ "$OPERATOR_COUNT" -eq 0 ]; then
                  echo "Error: No WAVS operators found running. Start backend first with 'task backend:start'"
                  exit 1
                fi
                echo "Found $OPERATOR_COUNT running operator(s)"
                for i in $(docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep '^wavs-operator-' | grep -oE '[0-9]+$' | sort -n); do
                  echo "Registering operator #$i..."
                  task avs:register-operator WAVS_INSTANCE="$i" WEIGHT="{{.WEIGHT}}"
                done
                echo "All operators registered"

    update-quorum:
        desc: "Update quorum configuration after operator registration"
        vars:
            CHAIN_NUMBER: '{{.SOURCE_CHAIN_NUMBER | default "1"}}'
            QUORUM_NUMERATOR: '{{.QUORUM_NUMERATOR | default "1"}}'
            QUORUM_DENOMINATOR: '{{.QUORUM_DENOMINATOR | default "2"}}'
        cmds:
            - echo "Updating quorum to {{.QUORUM_NUMERATOR}}/{{.QUORUM_DENOMINATOR}}..."
            - task middleware:update-quorum CHAIN_NUMBER="{{.CHAIN_NUMBER}}" QUORUM_NUMERATOR="{{.QUORUM_NUMERATOR}}" QUORUM_DENOMINATOR="{{.QUORUM_DENOMINATOR}}"
            - echo "Quorum updated"

    clean:
        desc: "Clean all build artifacts and temporary data"
        cmds:
            - rm -rf "{{.PROJECT_OUTPUT_DIR}}"

    run-tests:
        desc: "Run all test cases"
        cmds:
            - task: contracts:test

    ###################################################################
    #################### WASI Components ##############################
    ###################################################################

    components-build:
        desc: "Build WASI components (parallel)"
        deps: [components-clean]
        requires:
            vars: [REPO_ROOT]
        cmds:
            - task: components-build-parallel

    components-build-parallel:
        internal: true
        deps:
            - for: { var: WASI_COMPONENTS }
              task: build-single-component
              vars:
                  COMPONENT_NAME: "{{.ITEM}}"

    build-single-component:
        internal: true
        requires:
            vars: [COMPONENT_NAME]
        vars:
            COMPONENT_DIR: '{{joinPath .COMPONENTS_DIR (.COMPONENT_NAME | replace "_" "-")}}'
        cmds:
            - cd "{{.REPO_ROOT}}" && task component:build COMPONENT_NAME="{{.COMPONENT_NAME}}" COMPONENT_SOURCE_DIR="{{.COMPONENT_DIR}}"

    components-clean:
        desc: "Delete WASI component build outputs"
        requires:
            vars: [REPO_ROOT]
        cmds:
            - cd "{{.REPO_ROOT}}" && task component:clean-all

    components-upload:
        desc: "Upload WASI components to IPFS (parallel)"
        requires:
            vars: [REPO_ROOT]
        cmds:
            - task: components-upload-parallel

    components-upload-parallel:
        internal: true
        deps:
            - for: { var: WASI_COMPONENTS }
              task: upload-single-component
              vars:
                  COMPONENT_NAME: "{{.ITEM}}"

    upload-single-component:
        internal: true
        requires:
            vars: [COMPONENT_NAME]
        cmds:
            - cd "{{.REPO_ROOT}}" && task component:upload-to-ipfs COMPONENT_NAME="{{.COMPONENT_NAME}}"

    components-test:
        desc: "Test WASI components (parallel)"
        requires:
            vars: [REPO_ROOT]
        cmds:
            - task: components-test-parallel

    components-test-parallel:
        internal: true
        deps:
            - for: { var: WASI_COMPONENTS }
              task: test-single-component
              vars:
                  COMPONENT_NAME: "{{.ITEM}}"

    test-single-component:
        internal: true
        requires:
            vars: [COMPONENT_NAME]
        vars:
            COMPONENT_DIR: '{{joinPath .COMPONENTS_DIR (.COMPONENT_NAME | replace "_" "-")}}'
        cmds:
            - cd "{{.COMPONENT_DIR}}" && cargo test

    ###################################################################
    #################### Middleware ####################################
    ###################################################################

    middleware-deploy:
        desc: "Deploy POA middleware"
        vars:
            CHAIN_ARG: "{{if .SOURCE_CHAIN_NUMBER}}CHAIN_NUMBER={{.SOURCE_CHAIN_NUMBER}}{{end}}"
        requires:
            vars: [REPO_ROOT]
        cmds:
            - task middleware:deploy {{.CHAIN_ARG}}

    middleware-transfer-ownership:
        desc: "Transfer ownership of ECDSA proxy and AVS contracts (optional)"
        vars:
            TRANSFER_OWNERSHIP: '{{.TRANSFER_OWNERSHIP | default "false"}}'
            CHAIN_ARG: "{{if .SOURCE_CHAIN_NUMBER}}CHAIN_NUMBER={{.SOURCE_CHAIN_NUMBER}}{{end}}"
        requires:
            vars: [REPO_ROOT, PROXY_OWNER, AVS_OWNER]
        status:
            - '[ "{{.TRANSFER_OWNERSHIP}}" != "true" ]'
        cmds:
            - cd "{{.REPO_ROOT}}" && task middleware:transfer-ownership PROXY_OWNER="{{.PROXY_OWNER}}" AVS_OWNER="{{.AVS_OWNER}}" {{.CHAIN_ARG}}

    ###################################################################
    #################### Service Configuration ########################
    ###################################################################

    build-empty-service:
        desc: "Build the empty service configuration"
        deps: [clean-service]
        vars:
            CHAIN_NUMBER: '{{.SOURCE_CHAIN_NUMBER | default "1"}}'
            CHAIN_DIRNAME: "chain-{{.CHAIN_NUMBER}}"
            OUTPUT_DIR: "{{.PROJECT_OUTPUT_DIR}}/{{.CHAIN_DIRNAME}}/{{.AVS_PROJECT}}"
            SOURCE_CHAIN:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-chain-name-{{.SOURCE_CHAIN_NUMBER}}
            SERVICE_MANAGER_ADDRESS:
                sh: task avs:get-service-manager-address
        requires:
            vars:
                [
                    REPO_ROOT,
                    SERVICE_OUTPUT_DIR,
                    PROJECT_OUTPUT_DIR,
                    WAVS_CLI_SERVICE_JSON_PATH,
                    SOURCE_CHAIN_NUMBER,
                ]
        cmds:
            - |
                cd "{{.REPO_ROOT}}"
                mkdir -p {{.SERVICE_OUTPUT_DIR}}

                task cli:wavs -- {{.WAVS_SERVICE_CMD}} init --name {{.AVS_SERVICE_NAME}}
                task cli:wavs -- {{.WAVS_SERVICE_CMD}} manager set-evm --chain {{.SOURCE_CHAIN}} --address {{.SERVICE_MANAGER_ADDRESS}}

                echo "Service configuration built successfully"

    clean-service:
        desc: "Clean service configuration"
        requires:
            vars: [SERVICE_OUTPUT_DIR]
        cmds:
            - rm -rf "{{.SERVICE_OUTPUT_DIR}}"

    upload-service:
        desc: "Upload service configuration to IPFS (local Kubo for LOCAL, Pinata for TESTNET/MAINNET)"
        requires:
            vars: [REPO_ROOT, SERVICE_JSON_PATH, SERVICE_CID_JSON_PATH]
        cmds:
            - echo "Uploading service configuration to IPFS..."
            - task: ipfs:upload
              vars:
                UPLOAD_FILE: "{{.SERVICE_JSON_PATH}}"
                OUTPUT_FILE: "{{.SERVICE_CID_JSON_PATH}}"
            - echo "Service CID saved to {{.SERVICE_CID_JSON_PATH}}"

    dev-clear-services:
        desc: "Remove all registered services from WAVS operator (dev endpoint)"
        vars:
            WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
            WAVS_ENDPOINT:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-endpoint-{{.WAVS_INSTANCE}}
        requires:
            vars: [REPO_ROOT]
        cmds:
            - |
                response=$(curl -s "{{.WAVS_ENDPOINT}}/services")
                managers=$(echo "$response" | jq -c '.services | map(.manager)')
                if [ "$managers" = "null" ] || [ "$managers" = "[]" ]; then
                  echo "No WAVS services to delete"
                  exit 0
                fi
                delete_payload=$(jq -n --argjson managers "$managers" '{service_managers: $managers}')
                status=$(curl -s -o /tmp/dev-delete-services.txt -w "%{http_code}" -X DELETE "{{.WAVS_ENDPOINT}}/services" -H "Content-Type: application/json" -d "$delete_payload")
                if [ "$status" = "204" ] || [ "$status" = "404" ]; then
                  echo "Cleared existing WAVS services"
                  exit 0
                fi
                echo "Failed to clear WAVS services (HTTP $status)" >&2
                cat /tmp/dev-delete-services.txt >&2
                exit 1

    set-service-uri:
        vars:
            CHAIN_NUMBER: "{{.SOURCE_CHAIN_NUMBER | default 1}}"
            SERVICE_CID:
                sh: task avs:get-service-cid
            SERVICE_URI: "ipfs://{{.SERVICE_CID}}"
        cmds:
            - cd "{{.REPO_ROOT}}" && task middleware:set-service-uri CHAIN_NUMBER="{{.CHAIN_NUMBER}}" SERVICE_URI="{{.SERVICE_URI}}"

    register-service:
        vars:
            WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
            WAVS_ENDPOINT:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-endpoint-{{.WAVS_INSTANCE}}
            CHAIN_NUMBER: "{{.SOURCE_CHAIN_NUMBER | default 1}}"
            CHAIN_DIRNAME: "chain-{{.CHAIN_NUMBER}}"
            OUTPUT_DIR: "{{.PROJECT_OUTPUT_DIR}}/{{.CHAIN_DIRNAME}}/{{.AVS_PROJECT}}"
            SERVICE_MANAGER_ADDRESS:
                sh: task avs:get-service-manager-address
            SOURCE_CHAIN_NUMBER: "{{.SOURCE_CHAIN_NUMBER | default 1}}"
            CHAIN:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-chain-name-{{.SOURCE_CHAIN_NUMBER}} 2>/dev/null
        cmds:
            - |
                RESPONSE=$(curl -s -w "%{http_code}" -X POST "{{.WAVS_ENDPOINT}}/services" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "service_manager": {
                      "evm": {
                        "chain": "{{.CHAIN}}",
                        "address": "{{.SERVICE_MANAGER_ADDRESS}}"
                      }
                    }
                  }')
                HTTP_CODE="${RESPONSE: -3}"
                BODY="${RESPONSE%???}"
                if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "204" ]; then
                  echo "Service registered successfully"
                elif echo "$BODY" | grep -q "already registered"; then
                  echo "Service already registered, continuing..."
                else
                  echo "Error: Failed to register service (HTTP $HTTP_CODE)"
                  echo "$BODY"
                  exit 1
                fi

    deploy-service:
        desc: "Deploy service to operators using IPFS service URI"
        vars:
            WAVS_INSTANCE: '{{.WAVS_INSTANCE | default 1}}'
            WAVS_ENDPOINT:
                sh: cd '{{.REPO_ROOT}}' && task backend:get-wavs-endpoint-{{.WAVS_INSTANCE}}
            SERVICE_CID:
                sh: task avs:get-service-cid
            SERVICE_URI: 'ipfs://{{.SERVICE_CID}}'
        cmds:
            - 'echo "Deploying service to operator #{{.WAVS_INSTANCE}}..."'
            - 'echo "Service URI: {{.SERVICE_URI}}"'
            - task cli:wavs -- deploy-service --home /wavs-home --service-uri {{.SERVICE_URI}} --wavs-endpoint {{.WAVS_ENDPOINT}}

    register-operator:
        vars:
            WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
            WAVS_SIGNING_KEY:
                sh: task avs:get-service-signing-private-key WAVS_INSTANCE="{{.WAVS_INSTANCE}}"
            OPERATOR_ADDRESS:
                sh: task avs:get-operator-address WAVS_INSTANCE="{{.WAVS_INSTANCE}}"
            OPERATOR_KEY:
                sh: task avs:get-operator-private-key WAVS_INSTANCE="{{.WAVS_INSTANCE}}"
            WEIGHT: "{{.WEIGHT | default 10000000}}"
        cmds:
            - cd "{{.REPO_ROOT}}" && task middleware:register-operator OPERATOR_ADDRESS="{{.OPERATOR_ADDRESS}}" WEIGHT="{{.WEIGHT}}"
            - cd "{{.REPO_ROOT}}" && task middleware:update-signing-key OPERATOR_KEY="{{.OPERATOR_KEY}}" SIGNING_KEY="{{.WAVS_SIGNING_KEY}}"

    deploy-service-*:
        vars:
            WAVS_INSTANCE: "{{index .MATCH 0}}"
            WAVS_ENDPOINT:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-endpoint-{{.WAVS_INSTANCE}}
            SERVICE_CID:
                sh: task avs:get-service-cid
            SERVICE_URI: "ipfs://{{.SERVICE_CID}}"
        cmds:
            - task cli:wavs WAVS_INSTANCE={{.WAVS_INSTANCE}} -- deploy-service --home /wavs-home --service-uri {{.SERVICE_URI}} --wavs-endpoint {{.WAVS_ENDPOINT}}

    ###################################################################
    #################### Contract Deployment ###########################
    ###################################################################

    contracts-deploy:
        desc: "Deploy contracts with WAVS service manager address"
        vars:
            CHAIN_NUMBER: "1"
            CHAIN_DIRNAME: "chain-1"
            OUTPUT_DIR: "{{.PROJECT_OUTPUT_DIR}}/{{.CHAIN_DIRNAME}}/{{.AVS_PROJECT}}"
            WAVS_SERVICE_MANAGER_ADDRESS:
                sh: task avs:get-service-manager-address
            DEPLOY_TASK: '{{if eq .DEPLOY_ENV "MAINNET"}}contracts:deploy-mainnet{{else if eq .DEPLOY_ENV "TESTNET"}}contracts:deploy-testnet{{else}}contracts:deploy{{end}}'
        cmds:
            - cd "{{.REPO_ROOT}}" && task {{.DEPLOY_TASK}} WAVS_SERVICE_MANAGER_ADDRESS="{{.WAVS_SERVICE_MANAGER_ADDRESS}}"

    ###################################################################
    #################### Service Build ################################
    ###################################################################

    build-service:
        desc: "Build service configuration"
        deps: [clean-service]
        vars:
            CHAIN_NUMBER: "1"
            CHAIN_DIRNAME: "chain-1"
            OUTPUT_DIR: "{{.PROJECT_OUTPUT_DIR}}/{{.CHAIN_DIRNAME}}/{{.AVS_PROJECT}}"
            SUBMIT_CHAIN:
                sh: task backend:get-chain-name-1
            SERVICE_MANAGER_ADDRESS:
                sh: task avs:get-service-manager-address
        cmds:
            - |
                cd "{{.REPO_ROOT}}"
                mkdir -p {{.SERVICE_OUTPUT_DIR}}

                task cli:wavs -- {{.WAVS_SERVICE_CMD}} init --name {{.AVS_SERVICE_NAME}}

            - task: setup-workflow
              vars:
                  WORKFLOW_ID: "wavs_drand"
                  CONTRACT_ADDRESS_KEY: "GACHA_ADDRESS"
                  EVENT_SIGNATURE: "RandomnessRequested(uint256)"
                  COMPONENT_CID_NAME: "wavs_drand"
            - task: setup-workflow
              vars:
                  WORKFLOW_ID: "nft_appraisals"
                  CONTRACT_ADDRESS_KEY: "NFT_APPRAISAL_ADDRESS"
                  EVENT_SIGNATURE: "AppraisalRequested(address,uint256)"
                  COMPONENT_CID_NAME: "nft_appraisal"
            - task: setup-workflow
              vars:
                  WORKFLOW_ID: "pfp_rarity"
                  CONTRACT_ADDRESS_KEY: "PFP_COLLECTION_ADDRESS"
                  EVENT_SIGNATURE: "RandomnessRequested(uint256)"
                  COMPONENT_CID_NAME: "wavs_drand"
            - task: setup-service-manager

    setup-workflow:
        desc: "Configure a WAVS workflow (trigger, component, aggregator)"
        internal: true
        requires:
            vars: [WORKFLOW_ID, CONTRACT_ADDRESS_KEY, EVENT_SIGNATURE, COMPONENT_CID_NAME]
        vars:
            TRIGGER_CHAIN:
                sh: task backend:get-chain-name-1
            CONTRACT_ADDRESS:
                sh: awk -F= '/^{{.CONTRACT_ADDRESS_KEY}}=/{print $2}' {{.CONTRACT_ENV_FILE}}
            COMPONENT_CID:
                sh: jq -r '.cid' "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/{{.COMPONENT_CID_NAME}}-cid.json"
            EVENT_HASH:
                sh: cast keccak "{{.EVENT_SIGNATURE}}"
            AGGREGATOR_COMPONENT_CID:
                sh: jq -r '.cid' "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/aggregator_simple-cid.json"
            AGGREGATOR_COMPONENT_CONFIG:
                sh: task avs:get-aggregator-config-values AGGREGATOR_PROJECT="{{.AGGREGATOR_PROJECT}}" WORKFLOW_ID="{{.WORKFLOW_ID}}"
        preconditions:
            - sh: '[ -f "{{.CONTRACT_ENV_FILE}}" ]'
              msg: "{{.CONTRACT_ENV_FILE}} not found; run task contracts:deploy first"
            - sh: '[ -n "{{.CONTRACT_ADDRESS}}" ]'
              msg: "{{.CONTRACT_ADDRESS_KEY}} not set; re-run task contracts:deploy to generate {{.CONTRACT_ENV_FILE}}"
            - sh: '[ -f "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/{{.COMPONENT_CID_NAME}}-cid.json" ]'
              msg: "{{.COMPONENT_CID_NAME}} CID not found; run task avs:components-upload first"
            - sh: '[ -f "{{.REPO_ROOT}}/{{.PROJECT_OUTPUT_DIRNAME}}/components/aggregator_simple-cid.json" ]'
              msg: "aggregator_simple CID not found; run task avs:components-upload first"
        cmds:
            - |
                task cli:wavs -- {{.WAVS_SERVICE_CMD}} workflow add --id {{.WORKFLOW_ID}}

                task cli:wavs -- {{.WAVS_SERVICE_CMD}} workflow trigger --id {{.WORKFLOW_ID}} set-evm --chain {{.TRIGGER_CHAIN}} --address {{.CONTRACT_ADDRESS}} --event-hash {{.EVENT_HASH}}

                task cli:wavs -- {{.WAVS_SERVICE_CMD}} workflow component --id {{.WORKFLOW_ID}} set-source-uri --uri "ipfs://{{.COMPONENT_CID}}"
                task cli:wavs -- {{.WAVS_SERVICE_CMD}} workflow component --id {{.WORKFLOW_ID}} permissions --http-hosts '*' --file-system true

                task cli:wavs -- {{.WAVS_SERVICE_CMD}} workflow submit --id {{.WORKFLOW_ID}} set-aggregator
                task cli:wavs -- {{.WAVS_SERVICE_CMD}} workflow submit --id {{.WORKFLOW_ID}} component set-source-uri --uri "ipfs://{{.AGGREGATOR_COMPONENT_CID}}"
                task cli:wavs -- {{.WAVS_SERVICE_CMD}} workflow submit --id {{.WORKFLOW_ID}} component config {{.AGGREGATOR_COMPONENT_CONFIG}}
                task cli:wavs -- {{.WAVS_SERVICE_CMD}} workflow submit --id {{.WORKFLOW_ID}} component permissions --http-hosts '*' --file-system true

    setup-service-manager:
        desc: "Configure service manager"
        vars:
            CHAIN_NUMBER: "1"
            CHAIN_DIRNAME: "chain-1"
            OUTPUT_DIR: "{{.PROJECT_OUTPUT_DIR}}/{{.CHAIN_DIRNAME}}/{{.AVS_PROJECT}}"
            SUBMIT_CHAIN:
                sh: task backend:get-chain-name-1
            SERVICE_MANAGER_ADDRESS:
                sh: task avs:get-service-manager-address
        cmds:
            - task cli:wavs -- {{.WAVS_SERVICE_CMD}} manager set-evm --chain {{.SUBMIT_CHAIN}} --address {{.SERVICE_MANAGER_ADDRESS}}

    ###################################################################
    #################### Aggregator Config ############################
    ###################################################################

    get-aggregator-config-values:
        desc: "Get the aggregator config values"
        requires:
            vars: [AGGREGATOR_PROJECT, WORKFLOW_ID]
        vars:
            AGGREGATOR_FLAGS:
                sh: task avs:get-aggregator-simple-flags WORKFLOW_ID="{{.WORKFLOW_ID}}"
        cmds:
            - |
                case "{{.AGGREGATOR_PROJECT}}" in
                  "aggregator-simple")
                    echo "{{.AGGREGATOR_FLAGS}}"
                    ;;
                  *)
                    echo "Error: Unsupported aggregator project '{{.AGGREGATOR_PROJECT}}'. Only 'aggregator-simple' is supported." >&2
                    exit 1
                    ;;
                esac

    ###################################################################
    #################### Multi-operator ###############################
    ###################################################################

    wavs-*:
        vars:
            WAVS_INSTANCE: "{{index .MATCH 0}}"
        cmds:
            - task avs:components-upload WAVS_INSTANCE="{{.WAVS_INSTANCE}}"
            - task avs:deploy-service-{{.WAVS_INSTANCE}}
            - task avs:register-operator WAVS_INSTANCE="{{.WAVS_INSTANCE}}"

    wavs-all:
        vars:
            FIRST_OPERATOR: "{{.FIRST_OPERATOR | default 1}}"
        cmds:
            - |
                # Find all running WAVS operators and deploy to them
                for i in $(docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep '^wavs-operator-' | grep -oE '[0-9]+$' | sort -n); do
                  if [ "$i" -ne {{.FIRST_OPERATOR}} ]; then
                    task avs:wavs-$i FIRST_OPERATOR="{{.FIRST_OPERATOR}}"
                  fi
                done

    ###################################################################
    #################### Helpers ######################################
    ###################################################################

    get-component-digest:
        desc: "Get component digest from build artifacts"
        vars:
            COMPONENT: "{{.COMPONENT}}"
            COMPONENT_WASM_PATH: '{{joinPath .COMPONENTS_CARGO_RELEASE_DIR (printf "%s.wasm" .COMPONENT)}}'
        requires:
            vars: [COMPONENTS_CARGO_RELEASE_DIR, COMPONENT]
        cmds:
            - sha256sum "{{.COMPONENT_WASM_PATH}}" | cut -d' ' -f1

    get-service-cid:
        desc: "Get service CID from IPFS upload"
        requires:
            vars: [SERVICE_CID_JSON_PATH]
        preconditions:
            - sh: '[ -f "{{.SERVICE_CID_JSON_PATH}}" ]'
              msg: "Service CID not found; run task avs:upload-service first"
        cmds:
            - jq -r '.cid' "{{.SERVICE_CID_JSON_PATH}}"

    get-service-manager-address:
        desc: "Get service manager address"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            CHAIN_DIRNAME: "chain-{{.CHAIN_NUMBER}}"
            OUTPUT_DIR: "{{.PROJECT_OUTPUT_DIR}}/{{.CHAIN_DIRNAME}}/{{.AVS_PROJECT}}"
        requires:
            vars: [REPO_ROOT]
        cmds:
            - task middleware:get-service-manager-address CHAIN_NUMBER={{.CHAIN_NUMBER}} OUTPUT_DIR="{{.OUTPUT_DIR}}"

    get-stake-registry-address:
        desc: "Get stake registry address"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            CHAIN_DIRNAME: "chain-{{.CHAIN_NUMBER}}"
            OUTPUT_DIR: "{{.PROJECT_OUTPUT_DIR}}/{{.CHAIN_DIRNAME}}/{{.AVS_PROJECT}}"
        requires:
            vars: [REPO_ROOT]
        cmds:
            - task middleware:get-stake-registry-address CHAIN_NUMBER={{.CHAIN_NUMBER}} OUTPUT_DIR="{{.OUTPUT_DIR}}"

    get-service-hd-index:
        desc: "Get service HD index from WAVS endpoint"
        vars:
            WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
            WAVS_ENDPOINT:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-endpoint-{{.WAVS_INSTANCE}}
            SERVICE_MANAGER_ADDRESS:
                sh: task avs:get-service-manager-address
            CHAIN:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-chain-name-1 2>/dev/null
        requires:
            vars: [REPO_ROOT]
        cmds:
            - |
                for i in $(seq 1 {{.HEALTH_CHECK_TIMEOUT}}); do
                  response=$(curl -s -X POST "{{.WAVS_ENDPOINT}}/services/signer" \
                    -H "Content-Type: application/json" \
                    -d '{"service_manager":{"evm":{"chain":"{{.CHAIN}}","address":"{{.SERVICE_MANAGER_ADDRESS}}"}}}')
                  hd_index=$(echo "$response" | jq -rc ".secp256k1.hd_index")
                  if [ "$hd_index" != "null" ] && [ -n "$hd_index" ]; then
                    echo "$hd_index"
                    exit 0
                  fi
                  echo "Waiting for WAVS service signer..."
                  sleep 1
                done
                echo "Error: Failed to fetch WAVS service signer" >&2
                echo "$response" >&2
                exit 1

    get-service-signing-address:
        desc: "Get service signing address for WAVS instance"
        vars:
            WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
            HD_INDEX:
                sh: task avs:get-service-hd-index WAVS_INSTANCE={{.WAVS_INSTANCE}}
            OPERATOR_MNEMONIC:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-submission-mnemonic-{{.WAVS_INSTANCE}}
            AVS_SIGNING_ADDRESS:
                sh: cast wallet address --mnemonic "{{.OPERATOR_MNEMONIC}}" --mnemonic-index {{.HD_INDEX}}
        requires:
            vars: [REPO_ROOT]
        cmds:
            - echo "{{.AVS_SIGNING_ADDRESS}}"

    get-service-signing-private-key:
        desc: "Get service signing private key for WAVS instance"
        vars:
            WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
            HD_INDEX:
                sh: task avs:get-service-hd-index WAVS_INSTANCE={{.WAVS_INSTANCE}}
            OPERATOR_MNEMONIC:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-submission-mnemonic-{{.WAVS_INSTANCE}}
            AVS_SIGNING_PRIVATE_KEY:
                sh: cast wallet private-key --mnemonic "{{.OPERATOR_MNEMONIC}}" --mnemonic-index {{.HD_INDEX}}
        requires:
            vars: [REPO_ROOT]
        cmds:
            - echo "{{.AVS_SIGNING_PRIVATE_KEY}}"

    get-operator-address:
        desc: "Get the operator's address"
        vars:
            WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
            OPERATOR_MNEMONIC:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-submission-mnemonic-{{.WAVS_INSTANCE}}
            OPERATOR_ADDRESS:
                sh: cast wallet address --mnemonic "{{.OPERATOR_MNEMONIC}}"
        requires:
            vars: [REPO_ROOT]
        cmds:
            - echo "{{.OPERATOR_ADDRESS}}"

    get-operator-private-key:
        desc: "Get the operator's private key"
        vars:
            WAVS_INSTANCE: "{{.WAVS_INSTANCE | default 1}}"
            OPERATOR_MNEMONIC:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-wavs-submission-mnemonic-{{.WAVS_INSTANCE}}
            OPERATOR_PRIVATE_KEY:
                sh: cast wallet private-key --mnemonic "{{.OPERATOR_MNEMONIC}}" --mnemonic-index 0
        requires:
            vars: [REPO_ROOT]
        cmds:
            - echo "{{.OPERATOR_PRIVATE_KEY}}"

    get-submission-address:
        requires:
            vars: [WORKFLOW_ID]
        vars:
            GACHA_SERVICE_HANDLER_ADDRESS:
                sh: awk -F= '/^GACHA_SERVICE_HANDLER_ADDRESS=/{print $2}' {{.CONTRACT_ENV_FILE}}
            APPRAISAL_SERVICE_HANDLER_ADDRESS:
                sh: awk -F= '/^APPRAISAL_SERVICE_HANDLER_ADDRESS=/{print $2}' {{.CONTRACT_ENV_FILE}}
            PFP_SERVICE_HANDLER_ADDRESS:
                sh: awk -F= '/^PFP_SERVICE_HANDLER_ADDRESS=/{print $2}' {{.CONTRACT_ENV_FILE}}
        preconditions:
            - sh: '[ -f "{{.CONTRACT_ENV_FILE}}" ]'
              msg: "{{.CONTRACT_ENV_FILE}} not found; run task contracts:deploy first"
        cmds:
            - |
                case "{{.WORKFLOW_ID}}" in
                  "nft_appraisals")
                    echo "{{.APPRAISAL_SERVICE_HANDLER_ADDRESS}}"
                    ;;
                  "wavs_drand")
                    echo "{{.GACHA_SERVICE_HANDLER_ADDRESS}}"
                    ;;
                  "pfp_rarity")
                    echo "{{.PFP_SERVICE_HANDLER_ADDRESS}}"
                    ;;
                  *)
                    echo "Error: Unknown workflow ID {{.WORKFLOW_ID}}" >&2
                    exit 1
                    ;;
                esac

    get-aggregator-simple-flags:
        desc: "Get --values flags with chain_name=address format"
        requires:
            vars: [WORKFLOW_ID]
        vars:
            CHAIN:
                sh: cd "{{.REPO_ROOT}}" && task backend:get-chain-name-1
            SUBMISSION_ADDRESS:
                sh: task avs:get-submission-address WORKFLOW_ID="{{.WORKFLOW_ID}}"
        cmds:
            - echo "--values {{.CHAIN}}={{.SUBMISSION_ADDRESS}}"
