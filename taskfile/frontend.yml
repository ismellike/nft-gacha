version: "3"

vars:
  FRONTEND_DIR: ./frontend

tasks:
  install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm install

  dev:
    desc: Start frontend development server
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm dev
    deps: [install]

  build:
    desc: Build frontend for production
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm build
    deps: [install]

  codegen:
    desc: Generate TypeScript types from smart contracts
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - |
        if [ ! -d "../contracts/out" ]; then
          echo "❌ Contracts not built. Run 'task contracts:build' first"
          exit 1
        fi
        echo "🔄 Generating TypeScript types from contracts..."
        pnpm codegen
        echo "✅ TypeScript contract types generated in src/generated.ts"
    deps: [install]

  sync-env:
    desc: Port .env.local from root to frontend/.env.local with NEXT_PUBLIC_ prefixes
    cmds:
      - |
        if [ ! -f ".env.local" ]; then
          echo "❌ No .env.local found in root directory"
          exit 1
        fi
        echo "🔄 Porting environment variables from root to frontend/.env.local..."

        # Create or empty the frontend/.env.local file
        : > "{{.FRONTEND_DIR}}/.env.local"

        # Process the .env.local file (handle both literal \n and actual newlines)
        while IFS='=' read -r key value; do
          # Skip empty lines and comments
          if [[ -z "$key" || "$key" == \#* ]]; then
            continue
          fi
          # Add NEXT_PUBLIC_ prefix for client-accessible vars
          echo "NEXT_PUBLIC_${key}=${value}" >> "{{.FRONTEND_DIR}}/.env.local"
        done < <(cat .env.local | sed 's/\\n/\n/g')

        echo "✅ Environment variables synced to frontend/.env.local"

  sync-env-testnet:
    desc: Port .env.testnet (from DeployTestnet.s.sol) to frontend/.env.local with NEXT_PUBLIC_ prefixes
    cmds:
      - |
        if [ ! -f ".env.testnet" ]; then
          echo "❌ No .env.testnet found in root directory"
          echo "   Run 'task contracts:deploy-testnet' to generate it"
          exit 1
        fi
        echo "🔄 Porting testnet environment variables to frontend/.env.local..."

        # Create frontend/.env.local if it doesn't exist
        touch "{{.FRONTEND_DIR}}/.env.local"

        # Process the .env.testnet file and merge into frontend/.env.local
        while IFS='=' read -r key value; do
          # Skip empty lines and comments
          if [[ -z "$key" || "$key" == \#* ]]; then
            continue
          fi
          PREFIXED_KEY="NEXT_PUBLIC_${key}"
          # Remove existing entry if present, then append
          if grep -q "^${PREFIXED_KEY}=" "{{.FRONTEND_DIR}}/.env.local" 2>/dev/null; then
            sed -i "s|^${PREFIXED_KEY}=.*|${PREFIXED_KEY}=${value}|" "{{.FRONTEND_DIR}}/.env.local"
          else
            echo "${PREFIXED_KEY}=${value}" >> "{{.FRONTEND_DIR}}/.env.local"
          fi
        done < .env.testnet

        echo "✅ Testnet environment variables synced to frontend/.env.local"
