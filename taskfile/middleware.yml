version: "3"

includes:
    config:
        taskfile: ./config.yml
        flatten: true
    docker:
        taskfile: ./docker.yml
        flatten: true
    backend: ./backend.yml

tasks:
    deploy:
        desc: "Deploy POA middleware contracts"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            NODES_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        deps:
            - task: clean
        env:
            RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
            FUNDED_KEY: "{{.DEPLOYER_PRIVATE_KEY}}"
        cmds:
            - mkdir -p {{.NODES_DIR}}
            - >
                {{.DOCKER_SUDO}} docker run --rm --network host
                -e DEPLOY_ENV
                -e RPC_URL
                -e FUNDED_KEY
                -v {{.NODES_DIR}}:/root/.nodes
                {{.POA_MIDDLEWARE_DOCKER_IMAGE}} deploy

    register-operator:
        desc: "Register an operator with the POA stake registry"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            NODES_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        requires:
            vars: [OPERATOR_ADDRESS, WEIGHT]
        env:
            DEPLOY_ENV: '{{.DEPLOY_ENV | default "LOCAL"}}'
            RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
            FUNDED_KEY: "{{.DEPLOYER_PRIVATE_KEY}}"
        cmds:
            - |
                output=$( \
                  {{.DOCKER_SUDO}} docker run --rm --network host \
                  -e DEPLOY_ENV \
                  -e RPC_URL \
                  -e FUNDED_KEY \
                  -v {{.NODES_DIR}}:/root/.nodes \
                  {{.POA_MIDDLEWARE_DOCKER_IMAGE}} owner_operation registerOperator {{.OPERATOR_ADDRESS}} {{.WEIGHT}} \
                  2>&1
                )
                status=$?
                if [ "$status" -ne 0 ]; then
                  if echo "$output" | grep -q "OperatorAlreadyRegistered"; then
                    echo "Operator already registered, continuing..."
                    exit 0
                  fi
                  echo "$output"
                  exit "$status"
                fi
                echo "$output"

    update-operator-weight:
        desc: "Update the weight of a registered operator"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            NODES_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        requires:
            vars: [OPERATOR_ADDRESS, WEIGHT]
        env:
            DEPLOY_ENV: '{{.DEPLOY_ENV | default "LOCAL"}}'
            RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
            FUNDED_KEY: "{{.DEPLOYER_PRIVATE_KEY}}"
        cmds:
            - >
                {{.DOCKER_SUDO}} docker run --rm --network host
                -e DEPLOY_ENV
                -e RPC_URL
                -e FUNDED_KEY
                -v {{.NODES_DIR}}:/root/.nodes
                {{.POA_MIDDLEWARE_DOCKER_IMAGE}} owner_operation updateOperatorWeight {{.OPERATOR_ADDRESS}} {{.WEIGHT}}

    update-signing-key:
        desc: "Update the signing key for an operator"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            NODES_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        requires:
            vars: [OPERATOR_KEY, SIGNING_KEY]
        env:
            DEPLOY_ENV: '{{.DEPLOY_ENV | default "LOCAL"}}'
            RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
        cmds:
            - >
                {{.DOCKER_SUDO}} docker run --rm --network host
                -e DEPLOY_ENV
                -e RPC_URL
                -v {{.NODES_DIR}}:/root/.nodes
                {{.POA_MIDDLEWARE_DOCKER_IMAGE}} update_signing_key OPERATOR_KEY={{.OPERATOR_KEY}} SIGNING_KEY={{.SIGNING_KEY}}

    deregister-operator:
        desc: "Deregister an operator from the POA stake registry"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            NODES_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        requires:
            vars: [OPERATOR_ADDRESS]
        env:
            DEPLOY_ENV: '{{.DEPLOY_ENV | default "LOCAL"}}'
            RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
            FUNDED_KEY: "{{.DEPLOYER_PRIVATE_KEY}}"
        cmds:
            - >
                {{.DOCKER_SUDO}} docker run --rm --network host
                -e DEPLOY_ENV
                -e RPC_URL
                -e FUNDED_KEY
                -v {{.NODES_DIR}}:/root/.nodes
                {{.POA_MIDDLEWARE_DOCKER_IMAGE}} owner_operation deregisterOperator {{.OPERATOR_ADDRESS}}

    update-stake-threshold:
        desc: "Update the minimum stake threshold required for validation"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            NODES_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        requires:
            vars: [THRESHOLD]
        env:
            DEPLOY_ENV: '{{.DEPLOY_ENV | default "LOCAL"}}'
            RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
            FUNDED_KEY: "{{.DEPLOYER_PRIVATE_KEY}}"
        cmds:
            - >
                {{.DOCKER_SUDO}} docker run --rm --network host
                -e DEPLOY_ENV
                -e RPC_URL
                -e FUNDED_KEY
                -v {{.NODES_DIR}}:/root/.nodes
                {{.POA_MIDDLEWARE_DOCKER_IMAGE}} owner_operation updateStakeThreshold {{.THRESHOLD}}

    update-quorum:
        desc: "Update the quorum configuration for signature validation"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            NODES_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        requires:
            vars: [QUORUM_NUMERATOR, QUORUM_DENOMINATOR]
        env:
            DEPLOY_ENV: '{{.DEPLOY_ENV | default "LOCAL"}}'
            RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
            FUNDED_KEY: "{{.DEPLOYER_PRIVATE_KEY}}"
        cmds:
            - >
                {{.DOCKER_SUDO}} docker run --rm --network host
                -e DEPLOY_ENV
                -e RPC_URL
                -e FUNDED_KEY
                -v {{.NODES_DIR}}:/root/.nodes
                {{.POA_MIDDLEWARE_DOCKER_IMAGE}} owner_operation updateQuorum {{.QUORUM_NUMERATOR}} {{.QUORUM_DENOMINATOR}}

    clean:
        desc: "Clean up middleware nodes directory"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            NODES_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        cmds:
            - |
                echo "Cleaning up middleware nodes directory: {{.NODES_DIR}}"
            - rm -rf {{.NODES_DIR}}

    set-service-uri:
        desc: "Set the service URI on the service manager contract"
        vars:
            CHAIN_NUMBER: '{{.CHAIN_NUMBER | default "1"}}'
            RPC_URL:
                sh: task backend:get-evm-rpc-url-{{.CHAIN_NUMBER}}
            SERVICE_MANAGER_ADDRESS:
                sh: task middleware:get-service-manager-address CHAIN_NUMBER={{.CHAIN_NUMBER}}
        requires:
            vars: [SERVICE_URI]
        env:
            WAVS_SERVICE_MANAGER_ADDRESS: "{{.SERVICE_MANAGER_ADDRESS}}"
            SERVICE_URI: "{{.SERVICE_URI}}"
            FUNDED_KEY: "{{.DEPLOYER_PRIVATE_KEY}}"
        cmds:
            - |
                if [ -z "{{.RPC_URL}}" ]; then
                  echo "Error: RPC_URL is empty" >&2
                  exit 1
                fi
                RPC_PORT=$(echo "{{.RPC_URL}}" | sed 's|.*:||; s|/.*||')
                for i in $(seq 1 {{.HEALTH_CHECK_TIMEOUT}}); do
                  if nc -z 127.0.0.1 "$RPC_PORT"; then
                    break
                  fi
                  echo "Waiting for RPC at {{.RPC_URL}}..."
                  sleep 1
                done
                if [ "{{.DEPLOY_ENV}}" = "LOCAL" ]; then
                  if ! cast call "{{.SERVICE_MANAGER_ADDRESS}}" "getServiceURI()" --rpc-url "{{.RPC_URL}}" >/dev/null 2>&1; then
                    echo "Service manager does not support getServiceURI; skipping set-service-uri in LOCAL"
                    exit 0
                  fi
                fi
                echo "Setting service URI on {{.SERVICE_MANAGER_ADDRESS}}"
                cast send "{{.SERVICE_MANAGER_ADDRESS}}" "setServiceURI(string)" "{{.SERVICE_URI}}" --private-key "{{.DEPLOYER_PRIVATE_KEY}}" --rpc-url "{{.RPC_URL}}"

    get-output-dir:
        desc: "Get the path to the middleware output directory"
        vars:
            CHAIN_NUMBER: "{{.CHAIN_NUMBER | default 1}}"
            CHAIN_DIRNAME: "chain-{{.CHAIN_NUMBER}}"
            OUTPUT_DIR: '{{joinPath .REPO_ROOT ".project-output" .CHAIN_DIRNAME .AVS_PROJECT}}'
        cmds:
            - echo "{{.OUTPUT_DIR}}"

    get-json-filepath:
        desc: "Get the path to the middleware deploy JSON file"
        vars:
            CHAIN_NUMBER: "{{.CHAIN_NUMBER | default 1}}"
            OUTPUT_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        cmds:
            - echo "{{.OUTPUT_DIR}}/poa_deploy.json"

    get-service-manager-address:
        desc: "Get the WAVS Service Manager address from the middleware deploy JSON file"
        vars:
            CHAIN_NUMBER: "{{.CHAIN_NUMBER | default 1}}"
            OUTPUT_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        cmds:
            - |
                JSON_FILEPATH="{{.OUTPUT_DIR}}/poa_deploy.json"

                # Check if file exists
                if [ ! -f "$JSON_FILEPATH" ]; then
                  echo "Error: Deploy file not found at $JSON_FILEPATH" >&2
                  exit 1
                fi

                # Extract POAStakeRegistry address
                ADDRESS=$(jq -r '.addresses.POAStakeRegistry // empty' "$JSON_FILEPATH")
                if [ -z "$ADDRESS" ] || [ "$ADDRESS" = "null" ]; then
                  echo "Error: No POAStakeRegistry address found in $JSON_FILEPATH" >&2
                  exit 1
                fi
                echo "$ADDRESS"

    get-stake-registry-address:
        desc: "Get the Stake Registry address from the middleware deploy JSON file"
        vars:
            CHAIN_NUMBER: "{{.CHAIN_NUMBER | default 1}}"
            OUTPUT_DIR:
                sh: task middleware:get-output-dir CHAIN_NUMBER={{.CHAIN_NUMBER}}
        cmds:
            - |
                JSON_FILEPATH="{{.OUTPUT_DIR}}/poa_deploy.json"

                # Check if file exists
                if [ ! -f "$JSON_FILEPATH" ]; then
                  echo "Error: Deploy file not found at $JSON_FILEPATH" >&2
                  exit 1
                fi

                jq -r ".addresses.POAStakeRegistry" "$JSON_FILEPATH"
