version: "3"

includes:
    config:
        taskfile: ./config.yml
        flatten: true
    docker:
        taskfile: ./docker.yml
        flatten: true

env:
    # avoid namespace conflicts with other env vars
    # see https://github.com/go-task/task/issues/1038
    COMPOSE_FOUNDRY_DOCKER_IMAGE: "{{.FOUNDRY_DOCKER_IMAGE}}"
    COMPOSE_WAVS_DOCKER_IMAGE: "{{.WAVS_DOCKER_IMAGE}}"
    COMPOSE_JAEGER_DOCKER_IMAGE: "{{.JAEGER_DOCKER_IMAGE}}"
    COMPOSE_PROMETHEUS_DOCKER_IMAGE: "{{.PROMETHEUS_DOCKER_IMAGE}}"
    COMPOSE_IPFS_DOCKER_IMAGE: "{{.IPFS_DOCKER_IMAGE}}"
    COMPOSE_IPFS_API_PORT: "{{.IPFS_API_PORT}}"
    COMPOSE_IPFS_GATEWAY_PORT: "{{.IPFS_GATEWAY_PORT}}"
    COMPOSE_WAVS_HOME: "{{.WAVS_HOME_DIR}}"

tasks:
    start:
        desc: "Starts all backend services"
        deps:
            - task: start-chains
              vars:
                  CHAINS: "{{.CHAINS}}"
            - task: start-ipfs
            - task: start-wavs
              vars:
                  OPERATORS: "{{.OPERATORS}}"
            - task: start-telemetry

    stop:
        desc: "Stops all backend services"
        deps:
            - task: stop-chains
            - task: stop-ipfs
            - task: stop-wavs
            - task: stop-telemetry

    ###################################################################
    ######################## Chains ###################################
    ###################################################################
    start-chains:
        desc: "Start Anvil blockchain instances for local development"
        status:
            - '[ "{{.DEPLOY_ENV}}" != "LOCAL" ]'
        preconditions:
            - test -f "{{.BACKEND_DIR}}/docker-compose-anvil.yml"
            - sh: "command -v docker"
              msg: "Docker is required but not installed"
        # Pull the latest images before starting
        deps: [docker-pull-chains]
        cmds:
            - task: start-chains-inner
              # Optional - pass this in
              vars:
                  CHAINS: "{{.CHAINS | default 1}}"

    start-chains-inner:
        internal: true
        vars:
            CHAIN_RANGE:
                sh: seq 1 {{.CHAINS}}
        requires:
            vars: [CHAINS]
        deps:
            # All of these are started in parallel
            - for: { var: CHAIN_RANGE }
              task: start-chain-{{.ITEM}}

    stop-chains:
        desc: "Stop all running Anvil blockchain instances"
        status:
            - '[ "{{.DEPLOY_ENV}}" != "LOCAL" ]'
        cmds:
            - |
                # Stop all anvil-* projects
                for i in $(docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep '^anvil-' | sort -u); do
                    project_name="$i"
                    cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --project-name "$project_name" --file docker-compose-anvil.yml down --remove-orphans --volumes
                done

    start-chain-*:
        internal: true
        vars:
            CHAIN_NUMBER: "{{index .MATCH 0}}"
            ANVIL_PORT:
                sh: task backend:get-anvil-port-{{.CHAIN_NUMBER}}
        deps:
            - task: docker-start-chain-{{index .MATCH 0}}
        cmds:
            - |
                for ((i=0; i<{{.HEALTH_CHECK_TIMEOUT}}; i++)); do
                  if nc -z 127.0.0.1 {{.ANVIL_PORT}} 2>/dev/null; then
                    echo "Anvil chain #{{.CHAIN_NUMBER}} is up!"
                    exit 0
                  fi
                  echo "Waiting for Anvil chain #{{.CHAIN_NUMBER}} on port {{.ANVIL_PORT}}..."
                  sleep 1
                done
                echo "Error: Anvil chain #{{.CHAIN_NUMBER}} did not start after {{.HEALTH_CHECK_TIMEOUT}} seconds" >&2
                exit 1

    docker-pull-chains:
        status:
            - '[ "{{.DEPLOY_ENV}}" != "LOCAL" ]'
        internal: true
        cmds:
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-anvil.yml pull

    docker-start-chain-*:
        internal: true
        vars:
            CHAIN_NUMBER: "{{index .MATCH 0}}"
        env:
            COMPOSE_PROJECT_NAME: "anvil-{{.CHAIN_NUMBER}}"
            COMPOSE_ANVIL_PORT:
                sh: task backend:get-anvil-port-{{.CHAIN_NUMBER}}
        cmds:
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-anvil.yml up --force-recreate -d

    # HELPERS
    get-anvil-port-*:
        desc: "Get the Anvil port for a chain number"
        vars:
            CHAIN_NUMBER: "{{index .MATCH 0}}"
            ANVIL_PORT: "{{add .ANVIL_BASE_PORT (atoi .CHAIN_NUMBER)}}"
        cmds:
            - echo "{{.ANVIL_PORT}}"

    get-evm-rpc-url-*:
        desc: "Get the RPC URL for a chain number"
        vars:
            CHAIN_NUMBER: "{{index .MATCH 0}}"
            LOCAL_URL: "http://localhost:$(task backend:get-anvil-port-{{.CHAIN_NUMBER}})"
            TESTNET_URL: "{{index .TESTNET_EVM_RPC_URLS (sub (atoi .CHAIN_NUMBER) 1)}}"
            MAINNET_URL: "{{index .MAINNET_EVM_RPC_URLS (sub (atoi .CHAIN_NUMBER) 1)}}"
        cmds:
            - |
                case "{{.DEPLOY_ENV}}" in
                  "TESTNET") echo "{{.TESTNET_URL}}" ;;
                  "MAINNET") echo "{{.MAINNET_URL}}" ;;
                  *) echo "{{.LOCAL_URL}}" ;;
                esac

    get-chain-name-*:
        desc: "Get the chain name for a chain number"
        vars:
            CHAIN_NUMBER: "{{index .MATCH 0}}"
            LOCAL_NAME: "evm:{{add .ANVIL_FORK_CHAIN_ID (sub (atoi .CHAIN_NUMBER) 1)}}"
            TESTNET_NAME: "{{index .TESTNET_EVM_CHAIN_NAMES (sub (atoi .CHAIN_NUMBER) 1)}}"
            MAINNET_NAME: "{{index .MAINNET_EVM_CHAIN_NAMES (sub (atoi .CHAIN_NUMBER) 1)}}"
        cmds:
            - |
                case "{{.DEPLOY_ENV}}" in
                  "TESTNET") echo "{{.TESTNET_NAME}}" ;;
                  "MAINNET") echo "{{.MAINNET_NAME}}" ;;
                  *) echo "{{.LOCAL_NAME}}" ;;
                esac

    get-wavs-endpoint-*:
        desc: "Get the wavs endpoint for an instance"
        vars:
            WAVS_INSTANCE: "{{index .MATCH 0}}"
        cmds:
            - echo "http://localhost:{{add .WAVS_BASE_PORT (atoi .WAVS_INSTANCE)}}"

    ###################################################################
    ######################## WAVS #####################################
    ###################################################################
    start-wavs:
        desc: "Start WAVS operator instances and aggregator"
        preconditions:
            - test -f "{{.BACKEND_DIR}}/docker-compose-wavs-aggregator.yml"
            - test -f "{{.BACKEND_DIR}}/docker-compose-wavs-instance.yml"
            - sh: "command -v docker"
              msg: "Docker is required but not installed"
        # Pull the latest images before starting
        deps: [docker-pull-wavs, seed-wavs-config]
        cmds:
            - task: start-wavs-inner
              # Optional - pass this in, or 1 by default
              vars:
                  OPERATORS: '{{.OPERATORS | default "1"}}'

    docker-pull-wavs:
        internal: true
        cmds:
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-wavs-aggregator.yml pull
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-wavs-instance.yml pull

    start-wavs-inner:
        internal: true
        vars:
            OPERATORS_RANGE:
                sh: seq 1 {{.OPERATORS}}
        requires:
            vars: [OPERATORS]
        deps:
            - task: start-wavs-aggregator
            - for: { var: OPERATORS_RANGE }
              task: start-wavs-{{.ITEM}}

    start-wavs-aggregator:
        internal: true
        deps:
            - task: docker-start-wavs-aggregator
        cmds:
            - |
                for ((i=0; i<{{.HEALTH_CHECK_TIMEOUT}}; i++)); do
                  if nc -z 127.0.0.1 {{.WAVS_AGGREGATOR_PORT}} 2>/dev/null; then
                    echo "Aggregator is up!"
                    exit 0
                  fi
                  echo "Waiting for Aggregator on port {{.WAVS_AGGREGATOR_PORT}}..."
                  sleep 1
                done
                echo "Error: Aggregator did not start after {{.HEALTH_CHECK_TIMEOUT}} seconds" >&2
                exit 1

    start-wavs-*:
        internal: true
        vars:
            WAVS_INSTANCE: "{{index .MATCH 0}}"
            WAVS_PORT:
                sh: task backend:get-wavs-port-{{.WAVS_INSTANCE}}
        deps:
            - task: docker-start-wavs-{{.WAVS_INSTANCE}}
        cmds:
            - |
                for ((i=0; i<{{.HEALTH_CHECK_TIMEOUT}}; i++)); do
                  if nc -z 127.0.0.1 {{.WAVS_PORT}} 2>/dev/null; then
                    echo "WAVS #{{.WAVS_INSTANCE}} is up!"
                    exit 0
                  fi
                  echo "Waiting for WAVS #{{.WAVS_INSTANCE}} on port {{.WAVS_PORT}}..."
                  sleep 1
                done
                echo "Error: WAVS #{{.WAVS_INSTANCE}} did not start after {{.HEALTH_CHECK_TIMEOUT}} seconds" >&2
                exit 1

    docker-start-wavs-aggregator:
        internal: true
        env:
            COMPOSE_WAVS_AGGREGATOR_PORT: "{{.WAVS_AGGREGATOR_PORT}}"
        cmds:
            - echo "Starting WAVS Aggregator on port {{.WAVS_AGGREGATOR_PORT}}"
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-wavs-aggregator.yml up --force-recreate -d

    docker-start-wavs-*:
        internal: true
        vars:
            WAVS_INSTANCE: "{{index .MATCH 0}}"
            OPERATOR_MNEMONIC:
                sh: task backend:get-wavs-submission-mnemonic-{{.WAVS_INSTANCE}}
        env:
            COMPOSE_PROJECT_NAME: "wavs-operator-{{.WAVS_INSTANCE}}"
            COMPOSE_WAVS_PORT:
                sh: task backend:get-wavs-port-{{.WAVS_INSTANCE}}
            WAVS_OPERATOR_MNEMONIC: "{{.OPERATOR_MNEMONIC}}"
            WAVS_ENV_SCRYDEX_API_KEY: "{{.WAVS_ENV_SCRYDEX_API_KEY}}"
            WAVS_ENV_SCRYDEX_TEAM_ID: "{{.WAVS_ENV_SCRYDEX_TEAM_ID}}"
        cmds:
            - |
                echo "Starting WAVS #{{.WAVS_INSTANCE}} on port $COMPOSE_WAVS_PORT"
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-wavs-instance.yml up --force-recreate -d

    clean-wavs-data:
        desc: "Delete WAVS data directory (operator + aggregator state)"
        cmds:
            - rm -rf "{{.WAVS_HOME_DIR}}"

    seed-wavs-config:
        desc: "Seed WAVS home config"
        vars:
            WAVS_CONFIG_TEMPLATE: "{{.BACKEND_DIR}}/wavs.toml"
        cmds:
            - mkdir -p "{{.WAVS_HOME_DIR}}"
            - cp "{{.BACKEND_DIR}}/wavs.toml" "{{.WAVS_HOME_DIR}}/wavs.toml"

    stop-wavs:
        desc: "Stop all WAVS instances and aggregator"
        cmds:
            - task: stop-wavs-instances
            - task: stop-wavs-aggregator

    stop-wavs-aggregator:
        desc: "Stop WAVS aggregator service"
        cmds:
            - echo "Stopping WAVS Aggregator"
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-wavs-aggregator.yml down --remove-orphans --volumes

    stop-wavs-instances:
        desc: "Stop all WAVS operator instances"
        cmds:
            - |
                # Stop all wavs-operator-* projects
                for i in $(docker ps --format '{{"{{"}}.Names{{"}}"}}' | grep '^wavs-operator-' | sort -u); do
                    project_name="$i"
                    cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --project-name "$project_name" --file docker-compose-wavs-instance.yml down --remove-orphans --volumes
                done

    # HELPERS
    get-wavs-port-*:
        desc: "Get the WAVS port for a wavs number"
        vars:
            WAVS_INSTANCE: "{{index .MATCH 0}}"
            WAVS_PORT: "{{add .WAVS_BASE_PORT (atoi .WAVS_INSTANCE)}}"
        cmds:
            - echo "{{.WAVS_PORT}}"

    get-wavs-submission-mnemonic-*:
        desc: "Get the WAVS submission mnemonic for a wavs instance number"
        vars:
            WAVS_INSTANCE: "{{index .MATCH 0}}"
            ENV_VAR_NAME: "WAVS_OPERATOR_MNEMONIC_{{.WAVS_INSTANCE}}"
        cmds:
            - echo "${{.ENV_VAR_NAME}}"

    ###################################################################
    ######################## IPFS ######################################
    ###################################################################

    start-ipfs:
        desc: "Start IPFS Kubo node for local development"
        status:
            - '[ "{{.DEPLOY_ENV}}" != "LOCAL" ]'
        preconditions:
            - test -f "{{.BACKEND_DIR}}/docker-compose-ipfs.yml"
            - sh: "command -v docker"
        cmds:
            - echo "Starting IPFS Kubo node..."
            - >
                {{.DOCKER_SUDO}} docker compose -f {{.BACKEND_DIR}}/docker-compose-ipfs.yml
                -p ipfs up -d
            - |
                for ((i=0; i<{{.HEALTH_CHECK_TIMEOUT}}; i++)); do
                  if nc -z 127.0.0.1 {{.IPFS_API_PORT}} 2>/dev/null; then
                    echo "IPFS API is ready!"
                    break
                  fi
                  echo "Waiting for IPFS API..."
                  sleep 1
                done
            - task: configure-ipfs-gateway
            - |
                for ((i=0; i<{{.HEALTH_CHECK_TIMEOUT}}; i++)); do
                  if nc -z 127.0.0.1 {{.IPFS_GATEWAY_PORT}} 2>/dev/null; then
                    echo "IPFS gateway is ready!"
                    exit 0
                  fi
                  echo "Waiting for IPFS gateway..."
                  sleep 1
                done
                echo "Error: IPFS gateway did not start after {{.HEALTH_CHECK_TIMEOUT}} seconds" >&2
                exit 1

    stop-ipfs:
        desc: "Stop IPFS Kubo node"
        status:
            - '[ "{{.DEPLOY_ENV}}" != "LOCAL" ]'
        cmds:
            - echo "Stopping IPFS Kubo node..."
            - >
                {{.DOCKER_SUDO}} docker compose -f {{.BACKEND_DIR}}/docker-compose-ipfs.yml
                -p ipfs down

    configure-ipfs-gateway:
        desc: "Configure IPFS gateway to use path-based URLs (no subdomains)"
        cmds:
            - echo "Configuring IPFS gateway to use path-based URLs..."
            - |
                for ((i=0; i<{{.HEALTH_CHECK_TIMEOUT}}; i++)); do
                  if {{.DOCKER_SUDO}} docker compose -f {{.BACKEND_DIR}}/docker-compose-ipfs.yml -p ipfs exec ipfs ipfs id >/dev/null 2>&1; then
                    echo "IPFS is responding to config commands."
                    break
                  fi
                  echo "Waiting for IPFS to accept config commands..."
                  sleep 1
                done
            - >
                {{.DOCKER_SUDO}} docker compose -f {{.BACKEND_DIR}}/docker-compose-ipfs.yml -p ipfs exec ipfs ipfs config --json Gateway.PublicGateways '{"localhost":{"Paths":["/ipfs","/ipns"]}}'
            - >
                {{.DOCKER_SUDO}} docker compose -f {{.BACKEND_DIR}}/docker-compose-ipfs.yml -p ipfs exec ipfs ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001
            - >
                {{.DOCKER_SUDO}} docker compose -f {{.BACKEND_DIR}}/docker-compose-ipfs.yml -p ipfs exec ipfs ipfs config Addresses.Gateway /ip4/0.0.0.0/tcp/8080
            - echo "Restarting IPFS to apply config..."
            - >
                {{.DOCKER_SUDO}} docker restart ipfs-ipfs-1
            - sleep 5

    ###################################################################
    ##################### TELEMETRY ###################################
    ###################################################################

    start-telemetry:
        desc: "Start telemetry services (Jaeger and Prometheus)"
        # Pull the latest images before starting
        deps: [docker-pull-telemetry]
        cmds:
            - task: start-telemetry-inner

    docker-pull-telemetry:
        internal: true
        cmds:
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-telemetry.yml pull

    start-telemetry-inner:
        internal: true
        deps: [docker-start-telemetry]
        cmds:
            - |
                for ((i=0; i<{{.HEALTH_CHECK_TIMEOUT}}; i++)); do
                  if nc -z 127.0.0.1 16686 2>/dev/null; then
                    echo "Jaeger is up!"
                    break
                  fi
                  echo "Waiting for Jaeger on port 16686..."
                  sleep 1
                done
            - |
                for ((i=0; i<{{.HEALTH_CHECK_TIMEOUT}}; i++)); do
                  if nc -z 127.0.0.1 9090 2>/dev/null; then
                    echo "Prometheus is up!"
                    exit 0
                  fi
                  echo "Waiting for Prometheus on port 9090..."
                  sleep 1
                done

    docker-start-telemetry:
        internal: true
        cmds:
            - echo "Starting Telemetry"
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-telemetry.yml up --force-recreate -d

    stop-telemetry:
        desc: "Stop telemetry services (Jaeger and Prometheus)"
        cmds:
            - task: docker-stop-telemetry


    docker-stop-telemetry:
        internal: true
        cmds:
            - echo "Stopping Telemetry"
            - cd "{{.BACKEND_DIR}}" && {{.DOCKER_SUDO}} docker compose --file docker-compose-telemetry.yml down --remove-orphans --volumes
