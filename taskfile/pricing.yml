version: "3"

vars:
  PRICING_PREMIUM_BPS: 500
  MIN_SPIN_FEE: 0
  MAX_SPIN_FEE: 0
  # Rarity probabilities (must sum to 1.0)
  PROB_COMMON: 0.70
  PROB_UNCOMMON: 0.20
  PROB_RARE: 0.06
  PROB_EPIC: 0.03
  PROB_LEGENDARY: 0.01
  # Value ranges for each rarity
  MIN_COMMON: 20
  MAX_COMMON: 40
  MIN_UNCOMMON: 40
  MAX_UNCOMMON: 80
  MIN_RARE: 80
  MAX_RARE: 150
  MIN_EPIC: 150
  MAX_EPIC: 250
  MIN_LEGENDARY: 250
  MAX_LEGENDARY: 500

tasks:
  calc:
    desc: "Calculate dynamic spin price from configured variables"
    aliases: [calculate, price]
    vars:
      OUTPUT_FORMAT: '{{.OUTPUT_FORMAT | default "detailed"}}'
    cmds:
      - |
        jq -n --argjson premium {{.PRICING_PREMIUM_BPS}} \
          --argjson minFee {{.MIN_SPIN_FEE}} \
          --argjson maxFee {{.MAX_SPIN_FEE}} \
          --argjson probabilities '[{{.PROB_COMMON}}, {{.PROB_UNCOMMON}}, {{.PROB_RARE}}, {{.PROB_EPIC}}, {{.PROB_LEGENDARY}}]' \
          --argjson mins '[{{.MIN_COMMON}}, {{.MIN_UNCOMMON}}, {{.MIN_RARE}}, {{.MIN_EPIC}}, {{.MIN_LEGENDARY}}]' \
          --argjson maxs '[{{.MAX_COMMON}}, {{.MAX_UNCOMMON}}, {{.MAX_RARE}}, {{.MAX_EPIC}}, {{.MAX_LEGENDARY}}]' \
          --arg format "{{.OUTPUT_FORMAT}}" '
          def meanVal($min; $max): ($min + $max) / 2;
          def validate: 
            if ($probabilities | add | . > 1.01 or . < 0.99) then 
              error("Probabilities must sum to ~1.0, got: " + (. | tostring))
            else . end;
          validate |
          ($premium | tonumber) as $bps
          | ($bps / 10000.0) as $p
          | ([ range(0; ($probabilities | length)) | $probabilities[.] * meanVal($mins[.]; $maxs[.]) ] | add) as $ev
          | ($ev * (1.0 + $p)) as $uncapped
          | ($minFee | tonumber) as $min
          | ($maxFee | tonumber) as $max
          | (if $min > 0 and $uncapped < $min then $min
             elif $max > 0 and $uncapped > $max then $max
             else $uncapped end) as $spin
          | {
              pricingPremiumBps: $bps,
              minSpinFee: $min,
              maxSpinFee: $max,
              expectedValue: ($ev | . * 100 | round | . / 100),
              uncappedSpinPrice: ($uncapped | . * 100 | round | . / 100),
              spinPrice: ($spin | . * 100 | round | . / 100),
              rarityBreakdown: [
                {name: "Common", prob: $probabilities[0], range: "\($mins[0])-\($maxs[0])", ev: ($probabilities[0] * meanVal($mins[0]; $maxs[0]) | . * 100 | round | . / 100)},
                {name: "Uncommon", prob: $probabilities[1], range: "\($mins[1])-\($maxs[1])", ev: ($probabilities[1] * meanVal($mins[1]; $maxs[1]) | . * 100 | round | . / 100)},
                {name: "Rare", prob: $probabilities[2], range: "\($mins[2])-\($maxs[2])", ev: ($probabilities[2] * meanVal($mins[2]; $maxs[2]) | . * 100 | round | . / 100)},
                {name: "Epic", prob: $probabilities[3], range: "\($mins[3])-\($maxs[3])", ev: ($probabilities[3] * meanVal($mins[3]; $maxs[3]) | . * 100 | round | . / 100)},
                {name: "Legendary", prob: $probabilities[4], range: "\($mins[4])-\($maxs[4])", ev: ($probabilities[4] * meanVal($mins[4]; $maxs[4]) | . * 100 | round | . / 100)}
              ]
            }
          | . as $o
          | if $format == "json" then
              $o | @json
            elif $format == "summary" then
              "Spin: \($o.spinPrice) | EV: \($o.expectedValue) | Premium: \($o.pricingPremiumBps) bps"
            else
              "GACHA PRICING ANALYSIS\n"
              + "======================\n"
              + "Spin Price: \($o.spinPrice) units\n"
              + "Expected Value: \($o.expectedValue) units\n"
              + "Premium: \($o.pricingPremiumBps) bps (\(($o.pricingPremiumBps/100))%)\n"
              + "Min Spin Fee: \($o.minSpinFee) units\n"
              + "Max Spin Fee: \($o.maxSpinFee) units\n"
              + "Uncapped Price: \($o.uncappedSpinPrice) units\n\n"
              + "OUTCOMES:\n"
              + "  EV Premium: +\($o.spinPrice - $o.expectedValue) units\n\n"
              + "RARITIES:\n"
              + ($o.rarityBreakdown | map("  \(.name): \(.prob*100)% chance, \(.range) range, EV \(.ev)") | join("\n"))
            end'

  from-chain:
    desc: "Calculate pricing from live contract data"
    aliases: [chain, live]
    requires:
      vars: [GACHA_ADDRESS, RPC_URL]
    preconditions:
      - sh: "command -v cast"
        msg: "foundry cast is required but not installed"
    vars:
      OUTPUT_FORMAT: '{{.OUTPUT_FORMAT | default "detailed"}}'
    cmds:
      - |
        set -euo pipefail
        echo "Fetching on-chain data from {{.GACHA_ADDRESS}}..."
        
        CURRENT_FEE=$(cast call "{{.GACHA_ADDRESS}}" "getCurrentSpinFee()(uint256)" --rpc-url "{{.RPC_URL}}")
        EXPECTED_VALUE=$(cast call "{{.GACHA_ADDRESS}}" "getExpectedValueUSD()(uint256)" --rpc-url "{{.RPC_URL}}")
        FEE_DECIMALS=$(cast call "{{.GACHA_ADDRESS}}" "feeTokenDecimals()(uint8)" --rpc-url "{{.RPC_URL}}")
        PREMIUM_BPS=$(cast call "{{.GACHA_ADDRESS}}" "pricingPremiumBps()(uint256)" --rpc-url "{{.RPC_URL}}")
        MIN_FEE=$(cast call "{{.GACHA_ADDRESS}}" "minSpinFee()(uint256)" --rpc-url "{{.RPC_URL}}")
        MAX_FEE=$(cast call "{{.GACHA_ADDRESS}}" "maxSpinFee()(uint256)" --rpc-url "{{.RPC_URL}}")
        
        jq -n --argjson expected "$EXPECTED_VALUE" \
          --argjson decimals "$FEE_DECIMALS" \
          --argjson premium "$PREMIUM_BPS" \
          --argjson minFee "$MIN_FEE" \
          --argjson maxFee "$MAX_FEE" \
          --argjson currentFee "$CURRENT_FEE" \
          --arg format "{{.OUTPUT_FORMAT}}" '
          ($expected | tonumber) as $evUsd
          | ($decimals | tonumber) as $dec
          | (reduce range(0; $dec) as $i (1; . * 10)) as $scalar
          | ($evUsd * $scalar / 1e18) as $ev
          | ($premium | tonumber) as $bps
          | ($bps / 10000.0) as $p
          | ($ev * (1.0 + $p)) as $uncapped
          | ($minFee | tonumber) as $min
          | ($maxFee | tonumber) as $max
          | (if $min > 0 and $uncapped < $min then $min
             elif $max > 0 and $uncapped > $max then $max
             else $uncapped end) as $spin
          | {
              currentSpinFee: ($currentFee | tonumber),
              expectedValue: ($ev | . * 100 | round | . / 100),
              pricingPremiumBps: $bps,
              minSpinFee: $min,
              maxSpinFee: $max,
              uncappedSpinPrice: ($uncapped | . * 100 | round | . / 100),
              computedSpinPrice: ($spin | . * 100 | round | . / 100),
              adjustment: (($spin - ($currentFee | tonumber)) | . * 100 | round | . / 100)
            }
          | . as $o
          | if $format == "json" then
              $o | @json
            elif $format == "summary" then
              "Current: \($o.currentSpinFee) | Computed: \($o.computedSpinPrice) | Adjustment: \(if $o.adjustment > 0 then "+" else "" end)\($o.adjustment)"
            else
              "ON-CHAIN GACHA ANALYSIS\n"
              + "=======================\n"
              + "Contract: {{.GACHA_ADDRESS}}\n"
              + "Current Spin Fee: \($o.currentSpinFee) units\n"
              + "Computed Spin Price: \($o.computedSpinPrice) units\n"
              + "Expected Value: \($o.expectedValue) units\n"
              + "Premium: \($o.pricingPremiumBps) bps\n"
              + "Min Spin Fee: \($o.minSpinFee) units\n"
              + "Max Spin Fee: \($o.maxSpinFee) units\n"
              + "Uncapped Price: \($o.uncappedSpinPrice) units\n"
              + "Adjustment Needed: \(if $o.adjustment > 0 then "+" else "" end)\($o.adjustment) units\n"
              + "Premium Delta: +\($o.computedSpinPrice - $o.expectedValue) units"
            end'

  apply:
    desc: "Update pricing config on-chain"
    aliases: [set, update]
    requires:
      vars: [GACHA_ADDRESS, RPC_URL, PRICING_PREMIUM_BPS, MIN_SPIN_FEE, MAX_SPIN_FEE]
    preconditions:
      - sh: "[ -n \"${DEPLOYER_PRIVATE_KEY:-}\" ]"
        msg: "DEPLOYER_PRIVATE_KEY must be set in env"
      - sh: "command -v cast"
        msg: "foundry cast is required"
    vars:
      DRY_RUN: '{{.DRY_RUN | default false}}'
    cmds:
      - |
        set -euo pipefail
        
        CURRENT_PREMIUM=$(cast call "{{.GACHA_ADDRESS}}" "pricingPremiumBps()(uint256)" --rpc-url "{{.RPC_URL}}")
        CURRENT_MIN=$(cast call "{{.GACHA_ADDRESS}}" "minSpinFee()(uint256)" --rpc-url "{{.RPC_URL}}")
        CURRENT_MAX=$(cast call "{{.GACHA_ADDRESS}}" "maxSpinFee()(uint256)" --rpc-url "{{.RPC_URL}}")
        echo "PRICING CONFIG UPDATE"
        echo "====================="
        echo "Contract: {{.GACHA_ADDRESS}}"
        echo "Current Premium: $CURRENT_PREMIUM bps"
        echo "Current Min Fee: $CURRENT_MIN units"
        echo "Current Max Fee: $CURRENT_MAX units"
        echo "New Premium: {{.PRICING_PREMIUM_BPS}} bps"
        echo "New Min Fee: {{.MIN_SPIN_FEE}} units"
        echo "New Max Fee: {{.MAX_SPIN_FEE}} units"
        echo ""
        
        if [ "{{.DRY_RUN}}" = "true" ]; then
          echo "DRY RUN - No transaction sent"
          exit 0
        fi
        
        echo "Sending transaction..."
        TX_HASH=$(cast send {{.GACHA_ADDRESS}} \
          "setPricingConfig(uint256,uint256,uint256)" {{.PRICING_PREMIUM_BPS}} {{.MIN_SPIN_FEE}} {{.MAX_SPIN_FEE}} \
          --rpc-url {{.RPC_URL}} \
          --private-key ${DEPLOYER_PRIVATE_KEY} \
          --json | jq -r '.transactionHash')
        
        echo "Transaction: $TX_HASH"
        cast receipt "$TX_HASH" --rpc-url "{{.RPC_URL}}" > /dev/null
        
        NEW_PREMIUM=$(cast call "{{.GACHA_ADDRESS}}" "pricingPremiumBps()(uint256)" --rpc-url "{{.RPC_URL}}")
        NEW_MIN=$(cast call "{{.GACHA_ADDRESS}}" "minSpinFee()(uint256)" --rpc-url "{{.RPC_URL}}")
        NEW_MAX=$(cast call "{{.GACHA_ADDRESS}}" "maxSpinFee()(uint256)" --rpc-url "{{.RPC_URL}}")
        if [ "$NEW_PREMIUM" = "{{.PRICING_PREMIUM_BPS}}" ] && [ "$NEW_MIN" = "{{.MIN_SPIN_FEE}}" ] && [ "$NEW_MAX" = "{{.MAX_SPIN_FEE}}" ]; then
          echo "Success: Pricing config updated"
        else
          echo "Error: Expected premium/min/max {{.PRICING_PREMIUM_BPS}}/{{.MIN_SPIN_FEE}}/{{.MAX_SPIN_FEE}}, got $NEW_PREMIUM/$NEW_MIN/$NEW_MAX"
          exit 1
        fi

  fair:
    desc: "Compare base EV price vs premium and bounds"
    cmds:
      - |
        jq -n --argjson probabilities '[{{.PROB_COMMON}}, {{.PROB_UNCOMMON}}, {{.PROB_RARE}}, {{.PROB_EPIC}}, {{.PROB_LEGENDARY}}]' \
          --argjson mins '[{{.MIN_COMMON}}, {{.MIN_UNCOMMON}}, {{.MIN_RARE}}, {{.MIN_EPIC}}, {{.MIN_LEGENDARY}}]' \
          --argjson maxs '[{{.MAX_COMMON}}, {{.MAX_UNCOMMON}}, {{.MAX_RARE}}, {{.MAX_EPIC}}, {{.MAX_LEGENDARY}}]' \
          --argjson premiumBps {{.PRICING_PREMIUM_BPS}} \
          --argjson minFee {{.MIN_SPIN_FEE}} \
          --argjson maxFee {{.MAX_SPIN_FEE}} '
          def meanVal($min; $max): ($min + $max) / 2;
          
          ([ range(0; ($probabilities | length)) | $probabilities[.] * meanVal($mins[.]; $maxs[.]) ] | add) as $ev
          | ($premiumBps / 10000.0) as $premium
          | ($ev * (1.0 + $premium)) as $uncapped
          | ($minFee | tonumber) as $min
          | ($maxFee | tonumber) as $max
          | (if $min > 0 and $uncapped < $min then $min
             elif $max > 0 and $uncapped > $max then $max
             else $uncapped end) as $final
          | {
              expectedValue: ($ev | . * 100 | round | . / 100),
              premiumBps: ($premiumBps | tonumber),
              basePrice: ($ev | . * 100 | round | . / 100),
              uncappedPrice: ($uncapped | . * 100 | round | . / 100),
              finalPrice: ($final | . * 100 | round | . / 100),
              minSpinFee: $min,
              maxSpinFee: $max
            }
          | "PRICING BOUNDS COMPARISON"
          + "\n=========================="
          + "\nExpected Value: \(.expectedValue) units"
          + "\nPremium: \(.premiumBps) bps"
          + "\nMin Spin Fee: \(.minSpinFee) units"
          + "\nMax Spin Fee: \(.maxSpinFee) units"
          + "\n"
          + "\nBase Price (EV): \(.basePrice) units"
          + "\nUncapped Price: \(.uncappedPrice) units"
          + "\nFinal Price: \(.finalPrice) units"'

  simulate:
    desc: "Test different pricing premiums"
    vars:
      PREMIUM_RANGE: '{{.PREMIUM_RANGE | default "0,250,500,750,1000"}}'
    cmds:
      - |
        echo "PRICING SIMULATION"
        echo "=================="
        IFS=',' read -ra PREMIUMS <<< "{{.PREMIUM_RANGE}}"
        
        for premium in "${PREMIUMS[@]}"; do
          echo ""
          echo "Premium: $premium bps ($(echo "$premium / 100" | bc)%)"
          echo "----------------------------------------"
          PRICING_PREMIUM_BPS=$premium task pricing:calc OUTPUT_FORMAT=summary
        done

  validate:
    desc: "Validate current configuration"
    cmds:
      - |
        echo "CONFIGURATION VALIDATION"
        echo "========================"
        
        PROB_SUM=$(echo "{{.PROB_COMMON}} + {{.PROB_UNCOMMON}} + {{.PROB_RARE}} + {{.PROB_EPIC}} + {{.PROB_LEGENDARY}}" | bc -l)
        
        echo "Pricing Premium: {{.PRICING_PREMIUM_BPS}} bps"
        echo "Min Spin Fee: {{.MIN_SPIN_FEE}} units"
        echo "Max Spin Fee: {{.MAX_SPIN_FEE}} units"
        echo "Probability Sum: $PROB_SUM"
        
        if (( $(echo "$PROB_SUM > 1.01 || $PROB_SUM < 0.99" | bc -l) )); then
          echo "ERROR: Probabilities must sum to ~1.0"
          exit 1
        fi
        
        if [ {{.PRICING_PREMIUM_BPS}} -lt 0 ] || [ {{.PRICING_PREMIUM_BPS}} -gt 10000 ]; then
          echo "ERROR: Pricing premium must be 0-10000 bps"
          exit 1
        fi

        if [ {{.MAX_SPIN_FEE}} -gt 0 ] && [ {{.MIN_SPIN_FEE}} -gt {{.MAX_SPIN_FEE}} ]; then
          echo "ERROR: Min spin fee must be <= max spin fee"
          exit 1
        fi
        
        echo "Configuration is valid"
